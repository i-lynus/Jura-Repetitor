<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" width="500" height="140">
  <defs>
    <linearGradient id="neuGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60E040"/><stop offset="100%" stop-color="#208010"/>
    </linearGradient>
    <linearGradient id="seltenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FF6B6B"/>
      <stop offset="33%"  stop-color="#FFD700"/>
      <stop offset="66%"  stop-color="#A060FF"/>
      <stop offset="100%" stop-color="#60A0FF"/>
    </linearGradient>
    <linearGradient id="neuBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2008"/><stop offset="100%" stop-color="#061004"/>
    </linearGradient>
    <linearGradient id="foilGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FFD700"/>
      <stop offset="25%"  stop-color="#60E0FF"/>
      <stop offset="50%"  stop-color="#FF80FF"/>
      <stop offset="75%"  stop-color="#60FF80"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
    <filter id="labelGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="seltenGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- NEU! label -->
  <g transform="translate(10,20)">
    <!-- Starburst bg pixels -->
    <rect x="14" y="0"  width="58" height="6" fill="#208010" opacity="0.6" transform="rotate(-5,43,45)"/>
    <rect x="0"  y="14" width="6"  height="58" fill="#208010" opacity="0.6" transform="rotate(-5,43,45)"/>
    <!-- Main pill -->
    <rect x="0" y="12" width="86" height="44" rx="8" fill="url(#neuBg)" stroke="url(#neuGrad)" stroke-width="2.5" filter="url(#labelGlow)"/>
    <!-- Corner pixel accents -->
    <rect x="2"  y="14" width="6" height="6" fill="#60E040" opacity="0.6"/>
    <rect x="78" y="14" width="6" height="6" fill="#60E040" opacity="0.6"/>
    <rect x="2"  y="48" width="6" height="6" fill="#60E040" opacity="0.6"/>
    <rect x="78" y="48" width="6" height="6" fill="#60E040" opacity="0.6"/>
    <!-- Text -->
    <text x="43" y="42" font-family="'Courier New', monospace" font-size="26" font-weight="900"
          letter-spacing="2" fill="url(#neuGrad)" text-anchor="middle" filter="url(#labelGlow)">NEU!</text>
    <!-- Small stars -->
    <polygon points="8,10 9,13 12,13 10,15 11,18 8,16 5,18 6,15 4,13 7,13" fill="#60E040" opacity="0.8"/>
    <polygon points="78,8 79,11 82,11 80,13 81,16 78,14 75,16 76,13 74,11 77,11" fill="#60E040" opacity="0.8"/>
    <!-- Label below -->
    <text x="43" y="74" font-family="'Courier New', monospace" font-size="8" letter-spacing="2"
          fill="#60E040" text-anchor="middle" opacity="0.7">NEUE KARTE</text>
  </g>

  <!-- SELTEN! label -->
  <g transform="translate(120,10)">
    <!-- Glow burst -->
    <circle cx="95" cy="55" r="48" fill="none" stroke="url(#seltenGrad)" stroke-width="1" opacity="0.2" filter="url(#seltenGlow)"/>
    <circle cx="95" cy="55" r="38" fill="none" stroke="url(#seltenGrad)" stroke-width="1" opacity="0.15"/>
    <!-- Main panel -->
    <rect x="0" y="8" width="190" height="52" rx="8" fill="#0A0808" stroke="url(#seltenGrad)" stroke-width="2.5" filter="url(#seltenGlow)"/>
    <!-- Foil shimmer top stripe -->
    <rect x="2" y="10" width="186" height="6" rx="4" fill="url(#foilGrad)" opacity="0.3"/>
    <!-- Text -->
    <text x="95" y="46" font-family="'Courier New', monospace" font-size="28" font-weight="900"
          letter-spacing="3" fill="url(#seltenGrad)" text-anchor="middle" filter="url(#seltenGlow)">SELTEN!</text>
    <!-- Diamond pixel left -->
    <polygon points="12,32 20,42 12,52 4,42" fill="url(#seltenGrad)" opacity="0.7"/>
    <!-- Diamond pixel right -->
    <polygon points="178,32 186,42 178,52 170,42" fill="url(#seltenGrad)" opacity="0.7"/>
    <!-- Label below -->
    <text x="95" y="76" font-family="'Courier New', monospace" font-size="8" letter-spacing="2"
          fill="url(#seltenGrad)" text-anchor="middle" opacity="0.7">SELTENE KARTE GEFUNDEN</text>
  </g>

  <!-- FOIL shimmer effect strip -->
  <g transform="translate(330,20)">
    <rect x="0" y="0" width="155" height="50" rx="8" fill="#0A0808" stroke="url(#foilGrad)" stroke-width="2"/>
    <!-- Diagonal foil stripes (pixel style) -->
    <rect x="10" y="0"  width="8" height="50" fill="url(#foilGrad)" opacity="0.08" transform="skewX(-20)"/>
    <rect x="30" y="0"  width="5" height="50" fill="url(#foilGrad)" opacity="0.08" transform="skewX(-20)"/>
    <rect x="48" y="0"  width="8" height="50" fill="url(#foilGrad)" opacity="0.08" transform="skewX(-20)"/>
    <rect x="66" y="0"  width="5" height="50" fill="url(#foilGrad)" opacity="0.08" transform="skewX(-20)"/>
    <rect x="84" y="0"  width="8" height="50" fill="url(#foilGrad)" opacity="0.08" transform="skewX(-20)"/>
    <text x="77" y="32" font-family="'Courier New', monospace" font-size="16" font-weight="900"
          letter-spacing="2" fill="url(#foilGrad)" text-anchor="middle">HOLO FOIL</text>
    <text x="77" y="72" font-family="'Courier New', monospace" font-size="8" letter-spacing="2"
          fill="#C8922A" text-anchor="middle" opacity="0.7">KARTEN-EFFEKT</text>
  </g>
</svg>
