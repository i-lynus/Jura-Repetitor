<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <defs>
    <linearGradient id="iaFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241808"/><stop offset="100%" stop-color="#0D0A04"/>
    </linearGradient>
    <linearGradient id="iaGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5D060"/><stop offset="100%" stop-color="#9A6810"/>
    </linearGradient>
    <filter id="iaGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <text x="10" y="16" font-family="'Courier New', monospace" font-size="9" letter-spacing="3" fill="#C8922A" opacity="0.8">INTERAKTIONEN</text>

  <!-- SCAN -->
  <g transform="translate(10, 24)">
    <rect x="0" y="0" width="64" height="64" rx="12" fill="url(#iaFrame)" stroke="#40E0A0" stroke-width="2"/>
    <rect x="18" y="16" width="28" height="34" rx="3" fill="none" stroke="#40E0A0" stroke-width="2"/>
    <path d="M22,22 L22,26 L26,26" fill="none" stroke="#40E0A0" stroke-width="2" stroke-linecap="square"/>
    <path d="M42,22 L42,26 L38,26" fill="none" stroke="#40E0A0" stroke-width="2" stroke-linecap="square"/>
    <path d="M22,44 L22,40 L26,40" fill="none" stroke="#40E0A0" stroke-width="2" stroke-linecap="square"/>
    <path d="M42,44 L42,40 L38,40" fill="none" stroke="#40E0A0" stroke-width="2" stroke-linecap="square"/>
    <rect x="18" y="32" width="28" height="2" fill="#40E0A0" filter="url(#iaGlow)"/>
    <text x="32" y="60" font-family="'Courier New', monospace" font-size="7" fill="#40E0A0" text-anchor="middle">SCANNEN</text>
  </g>

  <!-- FAVORITE -->
  <g transform="translate(84, 24)">
    <rect x="0" y="0" width="64" height="64" rx="12" fill="url(#iaFrame)" stroke="url(#iaGold)" stroke-width="2"/>
    <!-- Heart pixel -->
    <rect x="20" y="20" width="8" height="8" fill="#E84080"/>
    <rect x="36" y="20" width="8" height="8" fill="#E84080"/>
    <rect x="16" y="24" width="32" height="8" fill="#E84080"/>
    <rect x="20" y="32" width="24" height="6" fill="#E84080"/>
    <rect x="24" y="38" width="16" height="6" fill="#E84080"/>
    <rect x="28" y="44" width="8" height="4" fill="#E84080"/>
    <rect x="20" y="22" width="6" height="4" fill="#FF80B0" opacity="0.6"/>
    <text x="32" y="60" font-family="'Courier New', monospace" font-size="7" fill="#F5D060" text-anchor="middle">FAVORIT</text>
  </g>

  <!-- SORT -->
  <g transform="translate(158, 24)">
    <rect x="0" y="0" width="64" height="64" rx="12" fill="url(#iaFrame)" stroke="url(#iaGold)" stroke-width="2"/>
    <!-- Sort bars -->
    <rect x="18" y="20" width="20" height="4" rx="2" fill="#F5D060"/>
    <rect x="18" y="30" width="14" height="4" rx="2" fill="#C8922A"/>
    <rect x="18" y="40" width="8"  height="4" rx="2" fill="#9A6810"/>
    <!-- Arrow -->
    <path d="M44,20 L44,44" stroke="#F5D060" stroke-width="2"/>
    <polygon points="40,38 48,38 44,46" fill="#F5D060"/>
    <text x="32" y="60" font-family="'Courier New', monospace" font-size="7" fill="#F5D060" text-anchor="middle">SORTIEREN</text>
  </g>

  <!-- SHARE -->
  <g transform="translate(232, 24)">
    <rect x="0" y="0" width="64" height="64" rx="12" fill="url(#iaFrame)" stroke="#7BBFEE" stroke-width="2"/>
    <!-- Share nodes -->
    <circle cx="24" cy="32" r="6" fill="#7BBFEE"/>
    <circle cx="42" cy="20" r="6" fill="#7BBFEE"/>
    <circle cx="42" cy="44" r="6" fill="#7BBFEE"/>
    <line x1="28" y1="29" x2="38" y2="22" stroke="#7BBFEE" stroke-width="2"/>
    <line x1="28" y1="35" x2="38" y2="42" stroke="#7BBFEE" stroke-width="2"/>
    <text x="32" y="60" font-family="'Courier New', monospace" font-size="7" fill="#7BBFEE" text-anchor="middle">TEILEN</text>
  </g>

  <!-- LOCK -->
  <g transform="translate(306, 24)">
    <rect x="0" y="0" width="64" height="64" rx="12" fill="url(#iaFrame)" stroke="#8A7A60" stroke-width="2"/>
    <rect x="22" y="30" width="20" height="16" rx="2" fill="none" stroke="#C8922A" stroke-width="2.5"/>
    <path d="M25,30 L25,24 Q25,18 32,18 Q39,18 39,24 L39,30" fill="none" stroke="#C8922A" stroke-width="2.5"/>
    <rect x="30" y="35" width="4" height="6" rx="2" fill="#C8922A"/>
    <text x="32" y="60" font-family="'Courier New', monospace" font-size="7" fill="#C8922A" text-anchor="middle">SPERREN</text>
  </g>

  <!-- VIEW IN DEX -->
  <g transform="translate(380, 24)">
    <rect x="0" y="0" width="64" height="64" rx="12" fill="url(#iaFrame)" stroke="url(#iaGold)" stroke-width="2"/>
    <!-- Open book -->
    <rect x="18" y="22" width="12" height="22" fill="#7A5010"/>
    <rect x="34" y="22" width="12" height="22" fill="#7A5010"/>
    <rect x="30" y="20" width="4" height="26" fill="#C8922A"/>
    <rect x="20" y="26" width="8" height="2" fill="#F5D060" opacity="0.6"/>
    <rect x="20" y="30" width="8" height="2" fill="#F5D060" opacity="0.6"/>
    <rect x="36" y="26" width="8" height="2" fill="#F5D060" opacity="0.6"/>
    <rect x="36" y="30" width="8" height="2" fill="#F5D060" opacity="0.6"/>
    <!-- Magnify -->
    <circle cx="40" cy="40" r="6" fill="none" stroke="#40E0A0" stroke-width="2"/>
    <line x1="44" y1="44" x2="48" y2="48" stroke="#40E0A0" stroke-width="2"/>
    <text x="32" y="60" font-family="'Courier New', monospace" font-size="7" fill="#F5D060" text-anchor="middle">IM CODEX</text>
  </g>
</svg>
