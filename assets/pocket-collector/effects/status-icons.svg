<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100">
  <defs>
    <filter id="stGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <text x="10" y="16" font-family="'Courier New', monospace" font-size="9" letter-spacing="3" fill="#C8922A" opacity="0.8">STATUS EFFEKTE</text>

  <!-- VERGIFTET (poisoned) -->
  <g transform="translate(10, 24)">
    <circle cx="28" cy="28" r="26" fill="#1A0A28" stroke="#A040E8" stroke-width="2"/>
    <!-- Poison bubble/drop -->
    <path d="M28,14 Q38,28 28,40 Q18,28 28,14 Z" fill="#A040E8" filter="url(#stGlow)"/>
    <circle cx="28" cy="32" r="5" fill="#C080FF" opacity="0.6"/>
    <circle cx="24" cy="20" r="2" fill="#E0B0FF" opacity="0.7"/>
    <!-- Bubbles -->
    <circle cx="40" cy="18" r="2.5" fill="#A040E8" opacity="0.6"/>
    <circle cx="16" cy="22" r="2"   fill="#A040E8" opacity="0.5"/>
    <text x="28" y="64" font-family="'Courier New', monospace" font-size="6" fill="#C080FF" text-anchor="middle">VERGIFTET</text>
  </g>

  <!-- VERBRANNT (burned) -->
  <g transform="translate(78, 24)">
    <circle cx="28" cy="28" r="26" fill="#280A08" stroke="#E87020" stroke-width="2"/>
    <!-- Flame -->
    <path d="M28,42 Q16,34 22,22 Q24,28 28,24 Q26,16 34,12 Q30,22 36,26 Q40,34 28,42 Z" fill="#FF8020" filter="url(#stGlow)"/>
    <path d="M28,40 Q22,34 26,26 Q28,30 30,26 Q32,32 28,40 Z" fill="#FFD700"/>
    <text x="28" y="64" font-family="'Courier New', monospace" font-size="6" fill="#FF8020" text-anchor="middle">VERBRANNT</text>
  </g>

  <!-- PARALYSIERT (paralyzed) -->
  <g transform="translate(146, 24)">
    <circle cx="28" cy="28" r="26" fill="#28220A" stroke="#E8C820" stroke-width="2"/>
    <!-- Lightning bolt -->
    <polygon points="32,12 20,30 28,30 24,44 38,24 30,24 36,12" fill="#FFD700" filter="url(#stGlow)"/>
    <polygon points="31,16 24,28 29,28 27,38 34,26 29,26 33,16" fill="#FFFDE0" opacity="0.5"/>
    <text x="28" y="64" font-family="'Courier New', monospace" font-size="6" fill="#FFD700" text-anchor="middle">PARALYSE</text>
  </g>

  <!-- SCHLAF (sleep) -->
  <g transform="translate(214, 24)">
    <circle cx="28" cy="28" r="26" fill="#0A1428" stroke="#5A8AB8" stroke-width="2"/>
    <!-- Z Z Z -->
    <text x="20" y="26" font-family="'Courier New', monospace" font-size="11" font-weight="900" fill="#7BBFEE" filter="url(#stGlow)">Z</text>
    <text x="28" y="34" font-family="'Courier New', monospace" font-size="9" font-weight="900" fill="#5A8AB8">z</text>
    <text x="34" y="40" font-family="'Courier New', monospace" font-size="7" font-weight="900" fill="#3A6A98">z</text>
    <text x="28" y="64" font-family="'Courier New', monospace" font-size="6" fill="#7BBFEE" text-anchor="middle">SCHLAF</text>
  </g>

  <!-- VERWIRRT (confused) -->
  <g transform="translate(282, 24)">
    <circle cx="28" cy="28" r="26" fill="#281A08" stroke="#E8A020" stroke-width="2"/>
    <!-- Spinning stars/swirl -->
    <path d="M16,24 Q28,14 40,24" fill="none" stroke="#FFC840" stroke-width="2" stroke-linecap="round"/>
    <polygon points="18,30 20,34 24,34 21,37 22,41 18,38 14,41 15,37 12,34 16,34" fill="#FFC840" filter="url(#stGlow)"/>
    <polygon points="38,30 40,34 44,34 41,37 42,41 38,38 34,41 35,37 32,34 36,34" fill="#FFC840" filter="url(#stGlow)"/>
    <circle cx="28" cy="38" r="2" fill="#FFE878"/>
    <text x="28" y="64" font-family="'Courier New', monospace" font-size="6" fill="#FFC840" text-anchor="middle">VERWIRRT</text>
  </g>

  <!-- SCHUTZSCHILD (shield) -->
  <g transform="translate(350, 24)">
    <circle cx="28" cy="28" r="26" fill="#0A2018" stroke="#40E0A0" stroke-width="2"/>
    <!-- Shield -->
    <path d="M28,14 L40,18 L40,30 Q40,40 28,44 Q16,40 16,30 L16,18 Z" fill="#104030" stroke="#40E0A0" stroke-width="2" filter="url(#stGlow)"/>
    <path d="M22,28 L26,32 L34,22" fill="none" stroke="#40E0A0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="64" font-family="'Courier New', monospace" font-size="5.5" fill="#40E0A0" text-anchor="middle">SCHUTZSCHILD</text>
  </g>
</svg>
