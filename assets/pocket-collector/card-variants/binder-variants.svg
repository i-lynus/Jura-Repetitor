<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200">
  <defs>
    <linearGradient id="standardBinder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D4A1A"/><stop offset="100%" stop-color="#1A2810"/>
    </linearGradient>
    <linearGradient id="premiumBinder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A5A88"/><stop offset="100%" stop-color="#1A2A48"/>
    </linearGradient>
    <linearGradient id="leatherBinder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A5010"/><stop offset="50%" stop-color="#C8922A"/><stop offset="100%" stop-color="#5A3808"/>
    </linearGradient>
    <linearGradient id="binderShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="binderGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="binderShadow">
      <feDropShadow dx="5" dy="8" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- STANDARD BINDER (green forest) -->
  <g transform="translate(12, 18)" filter="url(#binderShadow)">
    <!-- Spine -->
    <rect x="0" y="0" width="20" height="150" rx="3" fill="#1A3010" stroke="#2D6B1A" stroke-width="1.5"/>
    <!-- Ring holes on spine -->
    <circle cx="10" cy="32"  r="4" fill="none" stroke="#4A9B30" stroke-width="1.5"/>
    <circle cx="10" cy="62"  r="4" fill="none" stroke="#4A9B30" stroke-width="1.5"/>
    <circle cx="10" cy="92"  r="4" fill="none" stroke="#4A9B30" stroke-width="1.5"/>
    <circle cx="10" cy="122" r="4" fill="none" stroke="#4A9B30" stroke-width="1.5"/>
    <!-- Cover -->
    <rect x="18" y="0" width="100" height="150" rx="4" fill="url(#standardBinder)" stroke="#4A9B30" stroke-width="1.5"/>
    <rect x="20" y="2" width="96"  height="146" rx="3" fill="url(#binderShine)"/>
    <!-- Cover emblem -->
    <rect x="46" y="30" width="44" height="56" rx="4" fill="#1A3010" stroke="#2D6B1A" stroke-width="1"/>
    <!-- Leaf emblem -->
    <rect x="58" y="38" width="6"  height="6"  fill="#6DBF4A"/>
    <rect x="64" y="38" width="6"  height="6"  fill="#6DBF4A"/>
    <rect x="52" y="44" width="6"  height="6"  fill="#4A9B30"/>
    <rect x="58" y="44" width="6"  height="6"  fill="#A8E060"/>
    <rect x="64" y="44" width="6"  height="6"  fill="#6DBF4A"/>
    <rect x="70" y="44" width="6"  height="6"  fill="#4A9B30"/>
    <rect x="52" y="50" width="6"  height="6"  fill="#4A9B30"/>
    <rect x="58" y="50" width="6"  height="6"  fill="#A8E060"/>
    <rect x="64" y="50" width="6"  height="6"  fill="#4A9B30"/>
    <rect x="58" y="56" width="6"  height="6"  fill="#2D6B1A"/>
    <rect x="58" y="62" width="6"  height="6"  fill="#2D6B1A"/>
    <rect x="58" y="68" width="6"  height="6"  fill="#2D6B1A"/>
    <!-- Label strip -->
    <rect x="28" y="110" width="80" height="20" rx="2" fill="#1A3010" stroke="#4A9B30" stroke-width="0.5"/>
    <text x="68" y="123" font-family="'Courier New', monospace" font-size="7" font-weight="700"
          fill="#6DBF4A" text-anchor="middle" letter-spacing="1">STANDARD</text>
    <!-- Page edges -->
    <rect x="116" y="8" width="4" height="134" fill="#E8E0D0" opacity="0.6"/>
    <rect x="117" y="10" width="3" height="130" fill="#D8D0C0" opacity="0.4"/>
    <!-- Page lines (simulating pages) -->
    <line x1="116" y1="20" x2="120" y2="20" stroke="#C0B8A8" stroke-width="0.5"/>
    <line x1="116" y1="35" x2="120" y2="35" stroke="#C0B8A8" stroke-width="0.5"/>
    <line x1="116" y1="50" x2="120" y2="50" stroke="#C0B8A8" stroke-width="0.5"/>
    <line x1="116" y1="65" x2="120" y2="65" stroke="#C0B8A8" stroke-width="0.5"/>
    <line x1="116" y1="80" x2="120" y2="80" stroke="#C0B8A8" stroke-width="0.5"/>
    <line x1="116" y1="95" x2="120" y2="95" stroke="#C0B8A8" stroke-width="0.5"/>
    <line x1="116" y1="110" x2="120" y2="110" stroke="#C0B8A8" stroke-width="0.5"/>
    <line x1="116" y1="125" x2="120" y2="125" stroke="#C0B8A8" stroke-width="0.5"/>
    <text x="68" y="176" font-family="'Courier New', monospace" font-size="9" fill="#4A9B30" text-anchor="middle" font-weight="700">STANDARD BINDER</text>
  </g>

  <!-- PREMIUM BINDER (blue) -->
  <g transform="translate(185, 10)" filter="url(#binderShadow)">
    <rect x="0" y="0" width="22" height="160" rx="3" fill="#1A2A48" stroke="#3A5A88" stroke-width="1.5"/>
    <circle cx="11" cy="34"  r="5" fill="none" stroke="#5A8AB8" stroke-width="2"/>
    <circle cx="11" cy="66"  r="5" fill="none" stroke="#5A8AB8" stroke-width="2"/>
    <circle cx="11" cy="98"  r="5" fill="none" stroke="#5A8AB8" stroke-width="2"/>
    <circle cx="11" cy="130" r="5" fill="none" stroke="#5A8AB8" stroke-width="2"/>
    <!-- Cover -->
    <rect x="20" y="0" width="112" height="160" rx="4" fill="url(#premiumBinder)" stroke="#5A8AB8" stroke-width="2"/>
    <rect x="22" y="2" width="108" height="156" rx="3" fill="url(#binderShine)"/>
    <!-- Star emblem -->
    <rect x="48" y="30" width="56" height="70" rx="4" fill="#1A2A48" stroke="#3A5A88" stroke-width="1"/>
    <!-- Large star -->
    <polygon points="76,44 80,56 92,56 83,64 86,76 76,69 66,76 69,64 60,56 72,56"
             fill="#7BBFEE" stroke="#5A8AB8" stroke-width="0.5" filter="url(#binderGlow)"/>
    <!-- Inner star core -->
    <polygon points="76,50 78,56 84,56 79,60 81,66 76,62 71,66 73,60 68,56 74,56"
             fill="#A8D8FF" opacity="0.8"/>
    <!-- Stars around (small) -->
    <circle cx="52" cy="44" r="3" fill="#7BBFEE" opacity="0.6" filter="url(#binderGlow)"/>
    <circle cx="100" cy="44" r="3" fill="#7BBFEE" opacity="0.6" filter="url(#binderGlow)"/>
    <circle cx="52" cy="88" r="3" fill="#7BBFEE" opacity="0.6" filter="url(#binderGlow)"/>
    <circle cx="100" cy="88" r="3" fill="#7BBFEE" opacity="0.6" filter="url(#binderGlow)"/>
    <!-- Label -->
    <rect x="30" y="118" width="92" height="22" rx="2" fill="#1A2A48" stroke="#5A8AB8" stroke-width="0.5"/>
    <text x="76" y="132" font-family="'Courier New', monospace" font-size="7" font-weight="700"
          fill="#7BBFEE" text-anchor="middle" letter-spacing="1">PREMIUM</text>
    <!-- Pages -->
    <rect x="130" y="8" width="4" height="144" fill="#E8E0D0" opacity="0.5"/>
    <text x="76" y="182" font-family="'Courier New', monospace" font-size="9" fill="#5A8AB8" text-anchor="middle" font-weight="700">PREMIUM BINDER</text>
  </g>

  <!-- LEATHER BINDER (gold) -->
  <g transform="translate(370, 6)" filter="url(#binderShadow)">
    <rect x="0" y="0" width="24" height="166" rx="3" fill="#5A3808" stroke="url(#leatherBinder)" stroke-width="2"/>
    <!-- Brass rings -->
    <circle cx="12" cy="36"  r="6" fill="none" stroke="#C8922A" stroke-width="2.5" filter="url(#binderGlow)"/>
    <circle cx="12" cy="70"  r="6" fill="none" stroke="#C8922A" stroke-width="2.5" filter="url(#binderGlow)"/>
    <circle cx="12" cy="104" r="6" fill="none" stroke="#C8922A" stroke-width="2.5" filter="url(#binderGlow)"/>
    <circle cx="12" cy="138" r="6" fill="none" stroke="#C8922A" stroke-width="2.5" filter="url(#binderGlow)"/>
    <!-- Leather texture lines on spine -->
    <line x1="4" y1="15" x2="20" y2="15" stroke="#7A5010" stroke-width="0.5"/>
    <line x1="4" y1="45" x2="20" y2="45" stroke="#7A5010" stroke-width="0.5"/>
    <line x1="4" y1="80" x2="20" y2="80" stroke="#7A5010" stroke-width="0.5"/>
    <line x1="4" y1="115" x2="20" y2="115" stroke="#7A5010" stroke-width="0.5"/>
    <line x1="4" y1="150" x2="20" y2="150" stroke="#7A5010" stroke-width="0.5"/>
    <!-- Cover - leather textured -->
    <rect x="22" y="0"  width="118" height="166" rx="5" fill="#5A3808" stroke="url(#leatherBinder)" stroke-width="2.5"/>
    <!-- Leather grain pattern -->
    <rect x="22" y="0"  width="118" height="166" rx="5" fill="url(#binderShine)" opacity="0.5"/>
    <!-- Tooled leather frame -->
    <rect x="28" y="10" width="106" height="146" rx="4" fill="none" stroke="#C8922A" stroke-width="1.5"/>
    <rect x="34" y="16" width="94"  height="134" rx="3" fill="none" stroke="#9A6810" stroke-width="0.8" opacity="0.5"/>
    <!-- Central compass/medallion -->
    <circle cx="81" cy="70" r="36" fill="none" stroke="#C8922A" stroke-width="2" filter="url(#binderGlow)"/>
    <circle cx="81" cy="70" r="28" fill="#3A2008" stroke="#9A6810" stroke-width="1"/>
    <circle cx="81" cy="70" r="20" fill="none" stroke="#C8922A" stroke-width="0.5" opacity="0.5"/>
    <!-- Compass rose pixel -->
    <!-- N -->
    <rect x="78" y="44" width="6" height="14" fill="#C8922A" filter="url(#binderGlow)"/>
    <!-- S -->
    <rect x="78" y="82" width="6" height="14" fill="#C8922A"/>
    <!-- E -->
    <rect x="88" y="67" width="14" height="6" fill="#C8922A"/>
    <!-- W -->
    <rect x="58" y="67" width="14" height="6" fill="#C8922A"/>
    <!-- Diagonal arms -->
    <rect x="68" y="56" width="6" height="6" fill="#9A6810" opacity="0.7"/>
    <rect x="86" y="56" width="6" height="6" fill="#9A6810" opacity="0.7"/>
    <rect x="68" y="78" width="6" height="6" fill="#9A6810" opacity="0.7"/>
    <rect x="86" y="78" width="6" height="6" fill="#9A6810" opacity="0.7"/>
    <!-- Center jewel -->
    <circle cx="81" cy="70" r="6" fill="#C8922A" stroke="#F5D060" stroke-width="1" filter="url(#binderGlow)"/>
    <circle cx="80" cy="69" r="2" fill="#F5D060" opacity="0.7"/>
    <!-- Label panel -->
    <rect x="34" y="120" width="94" height="24" rx="3" fill="#3A2008" stroke="#C8922A" stroke-width="1"/>
    <text x="81" y="135" font-family="'Courier New', monospace" font-size="8" font-weight="900"
          fill="#F5D060" text-anchor="middle" letter-spacing="2" filter="url(#binderGlow)">LEDER BINDER</text>
    <!-- Corner ornaments on cover -->
    <rect x="30" y="12" width="8" height="8" fill="#C8922A" opacity="0.5"/>
    <rect x="122" y="12" width="8" height="8" fill="#C8922A" opacity="0.5"/>
    <rect x="30" y="148" width="8" height="8" fill="#C8922A" opacity="0.5"/>
    <rect x="122" y="148" width="8" height="8" fill="#C8922A" opacity="0.5"/>
    <!-- Pages -->
    <rect x="138" y="10" width="5" height="146" fill="#E8E0D0" opacity="0.5"/>
    <text x="81" y="188" font-family="'Courier New', monospace" font-size="9" fill="#C8922A" text-anchor="middle" font-weight="700">LEDER BINDER</text>
  </g>
</svg>
