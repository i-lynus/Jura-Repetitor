<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220">
  <defs>
    <!-- HOLO shimmer gradient -->
    <linearGradient id="holoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFD700"/>
      <stop offset="20%"  stop-color="#FF80FF"/>
      <stop offset="40%"  stop-color="#60C0FF"/>
      <stop offset="60%"  stop-color="#60FF80"/>
      <stop offset="80%"  stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF80FF"/>
    </linearGradient>
    <!-- FULL ART gradient -->
    <linearGradient id="fullArtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0A0818"/>
      <stop offset="50%"  stop-color="#1A1430"/>
      <stop offset="100%" stop-color="#0A0810"/>
    </linearGradient>
    <!-- GOLD card gradient -->
    <linearGradient id="goldCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#F5D060"/>
      <stop offset="30%"  stop-color="#C8922A"/>
      <stop offset="70%"  stop-color="#F5D060"/>
      <stop offset="100%" stop-color="#9A6810"/>
    </linearGradient>
    <!-- RAINBOW -->
    <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FF6B6B"/>
      <stop offset="20%"  stop-color="#FFD700"/>
      <stop offset="40%"  stop-color="#6DBF4A"/>
      <stop offset="60%"  stop-color="#60A0FF"/>
      <stop offset="80%"  stop-color="#A060FF"/>
      <stop offset="100%" stop-color="#FF6B6B"/>
    </linearGradient>
    <!-- SKETCH -->
    <linearGradient id="sketchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8E0D0"/><stop offset="100%" stop-color="#C0B8A0"/>
    </linearGradient>
    <filter id="varGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="goldMetallic">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- HOLO Card -->
  <g transform="translate(10, 16)">
    <rect x="0" y="0" width="98" height="140" rx="8" fill="#0A0808" stroke="url(#holoGrad)" stroke-width="2.5" filter="url(#varGlow)"/>
    <!-- Holo shimmer stripes -->
    <rect x="2"  y="2"  width="94" height="136" rx="7" fill="url(#holoGrad)" opacity="0.08"/>
    <rect x="2"  y="14" width="94" height="3"   fill="url(#holoGrad)" opacity="0.15"/>
    <rect x="2"  y="22" width="94" height="3"   fill="url(#holoGrad)" opacity="0.15"/>
    <rect x="2"  y="30" width="94" height="3"   fill="url(#holoGrad)" opacity="0.15"/>
    <rect x="2"  y="38" width="94" height="3"   fill="url(#holoGrad)" opacity="0.15"/>
    <rect x="2"  y="46" width="94" height="3"   fill="url(#holoGrad)" opacity="0.15"/>
    <rect x="2"  y="54" width="94" height="3"   fill="url(#holoGrad)" opacity="0.15"/>
    <rect x="2"  y="62" width="94" height="3"   fill="url(#holoGrad)" opacity="0.15"/>
    <rect x="2"  y="70" width="94" height="3"   fill="url(#holoGrad)" opacity="0.15"/>
    <rect x="2"  y="78" width="94" height="3"   fill="url(#holoGrad)" opacity="0.15"/>
    <!-- Art area -->
    <rect x="8" y="20" width="82" height="60" rx="4" fill="#0A0808" opacity="0.7"/>
    <!-- Pixel creature (holo silhouette) -->
    <rect x="38" y="26" width="22" height="8"  fill="#FFD700" opacity="0.6"/>
    <rect x="30" y="34" width="38" height="14" fill="#FF80FF" opacity="0.5"/>
    <rect x="34" y="48" width="30" height="10" fill="#60C0FF" opacity="0.5"/>
    <!-- Name bar -->
    <rect x="8" y="88" width="82" height="14" rx="2" fill="#1A1210" stroke="url(#holoGrad)" stroke-width="0.5"/>
    <text x="49" y="99" font-family="'Courier New', monospace" font-size="8" fill="url(#holoGrad)" text-anchor="middle" font-weight="700">HOLO KARTE</text>
    <!-- Stats -->
    <rect x="8" y="106" width="82" height="28" rx="2" fill="#0A0808"/>
    <rect x="12" y="110" width="36" height="4" rx="1" fill="#FFD700" opacity="0.4"/>
    <rect x="12" y="118" width="28" height="4" rx="1" fill="#FF80FF" opacity="0.4"/>
    <rect x="12" y="126" width="40" height="4" rx="1" fill="#60C0FF" opacity="0.4"/>
    <!-- Corner shine -->
    <rect x="2" y="2"  width="14" height="6"  fill="#FFFFFF" opacity="0.08"/>
    <text x="49" y="158" font-family="'Courier New', monospace" font-size="8" fill="url(#holoGrad)" text-anchor="middle" font-weight="700">HOLO</text>
  </g>

  <!-- FULL ART Card -->
  <g transform="translate(126, 16)">
    <rect x="0" y="0" width="98" height="140" rx="8" fill="url(#fullArtGrad)" stroke="#8060C0" stroke-width="2" filter="url(#varGlow)"/>
    <!-- Art bleeds to edges (full bleed) -->
    <rect x="2"  y="2"  width="94" height="100" rx="7" fill="#1A1030" opacity="0.8"/>
    <!-- Stars scattered as art -->
    <circle cx="20" cy="20" r="2" fill="#C0A0FF" opacity="0.8" filter="url(#varGlow)"/>
    <circle cx="50" cy="12" r="3" fill="#FFD700" opacity="0.7" filter="url(#varGlow)"/>
    <circle cx="76" cy="24" r="2" fill="#60C0FF" opacity="0.8" filter="url(#varGlow)"/>
    <circle cx="34" cy="40" r="2" fill="#FF80FF" opacity="0.7" filter="url(#varGlow)"/>
    <circle cx="70" cy="50" r="2.5" fill="#C0A0FF" opacity="0.8" filter="url(#varGlow)"/>
    <!-- Central art element -->
    <rect x="34" y="28" width="30" height="50" fill="#2A1848" opacity="0.9"/>
    <rect x="38" y="32" width="22" height="38" fill="#1A1030" opacity="0.8"/>
    <!-- Cosmic creature -->
    <circle cx="49" cy="52" r="14" fill="#4030A0" opacity="0.8" filter="url(#varGlow)"/>
    <circle cx="49" cy="52" r="8"  fill="#8060E0" opacity="0.6"/>
    <circle cx="45" cy="48" r="3"  fill="#FFFFFF" opacity="0.9"/>
    <circle cx="53" cy="48" r="3"  fill="#FFFFFF" opacity="0.9"/>
    <!-- Name (overlaid on art) -->
    <rect x="4"  y="104" width="90" height="1" fill="#8060C0" opacity="0.5"/>
    <rect x="4"  y="106" width="90" height="28" rx="2" fill="#0A0818" opacity="0.85"/>
    <text x="49" y="118" font-family="'Courier New', monospace" font-size="8" fill="#C0A0FF" text-anchor="middle" font-weight="700">FULL ART</text>
    <rect x="8"  y="122" width="82" height="4" rx="1" fill="#8060C0" opacity="0.5"/>
    <rect x="8"  y="128" width="60" height="4" rx="1" fill="#8060C0" opacity="0.4"/>
    <text x="49" y="158" font-family="'Courier New', monospace" font-size="8" fill="#C0A0FF" text-anchor="middle" font-weight="700">FULL ART</text>
  </g>

  <!-- GOLD Card -->
  <g transform="translate(242, 16)">
    <rect x="0" y="0" width="98" height="140" rx="8" fill="#1A1004" stroke="url(#goldCardGrad)" stroke-width="3" filter="url(#goldMetallic)"/>
    <!-- Metallic sheen -->
    <rect x="2"  y="2"  width="94" height="30" rx="7" fill="#F5D060" opacity="0.06"/>
    <!-- Gold frame inner -->
    <rect x="6"  y="6"  width="86" height="128" rx="5" fill="none" stroke="#C8922A" stroke-width="1" opacity="0.5"/>
    <!-- Art area gold tinted -->
    <rect x="8"  y="16" width="82" height="70" rx="3" fill="#3A2808"/>
    <!-- Gold silhouette creature (solid gold) -->
    <rect x="34" y="22" width="30" height="8"  fill="url(#goldCardGrad)" opacity="0.8"/>
    <rect x="26" y="30" width="46" height="18" fill="url(#goldCardGrad)" opacity="0.9"/>
    <rect x="30" y="48" width="38" height="14" fill="#C8922A" opacity="0.8"/>
    <rect x="34" y="62" width="10" height="18" fill="#9A6810" opacity="0.7"/>
    <rect x="54" y="62" width="10" height="18" fill="#9A6810" opacity="0.7"/>
    <!-- Gold shine lines -->
    <line x1="10" y1="20" x2="88" y2="20" stroke="#F5D060" stroke-width="0.5" opacity="0.3"/>
    <line x1="14" y1="36" x2="84" y2="28" stroke="#FFE878" stroke-width="0.5" opacity="0.2"/>
    <!-- Name -->
    <rect x="8"  y="90" width="82" height="16" rx="2" fill="#2A1804" stroke="url(#goldCardGrad)" stroke-width="0.5"/>
    <text x="49" y="102" font-family="'Courier New', monospace" font-size="8" fill="#F5D060" text-anchor="middle" font-weight="700" filter="url(#goldMetallic)">GOLD KARTE</text>
    <!-- Stats bars -->
    <rect x="8"  y="110" width="82" height="24" rx="2" fill="#1A1004"/>
    <rect x="12" y="114" width="40" height="4" rx="1" fill="url(#goldCardGrad)" opacity="0.6"/>
    <rect x="12" y="122" width="60" height="4" rx="1" fill="url(#goldCardGrad)" opacity="0.4"/>
    <text x="49" y="158" font-family="'Courier New', monospace" font-size="8" fill="#F5D060" text-anchor="middle" font-weight="700">GOLD</text>
  </g>

  <!-- RAINBOW Card -->
  <g transform="translate(358, 16)">
    <rect x="0" y="0" width="98" height="140" rx="8" fill="#0A0808" stroke="url(#rainbowGrad)" stroke-width="3" filter="url(#varGlow)"/>
    <!-- Rainbow diagonal stripes -->
    <rect x="0"  y="0"  width="98" height="140" rx="8" fill="url(#rainbowGrad)" opacity="0.06"/>
    <!-- Diagonal shimmer lines -->
    <line x1="0"  y1="40"  x2="40"  y2="0"   stroke="url(#rainbowGrad)" stroke-width="2" opacity="0.2"/>
    <line x1="0"  y1="80"  x2="80"  y2="0"   stroke="url(#rainbowGrad)" stroke-width="2" opacity="0.2"/>
    <line x1="0"  y1="120" x2="98"  y2="22"  stroke="url(#rainbowGrad)" stroke-width="2" opacity="0.2"/>
    <line x1="20" y1="140" x2="98"  y2="62"  stroke="url(#rainbowGrad)" stroke-width="2" opacity="0.2"/>
    <line x1="60" y1="140" x2="98"  y2="102" stroke="url(#rainbowGrad)" stroke-width="2" opacity="0.2"/>
    <!-- Art area -->
    <rect x="8"  y="14" width="82" height="72" rx="4" fill="#0A0808" opacity="0.8"/>
    <!-- Rainbow creature pixels -->
    <rect x="34" y="22" width="8"  height="8"  fill="#FF6B6B"/>
    <rect x="42" y="22" width="8"  height="8"  fill="#FFD700"/>
    <rect x="50" y="22" width="8"  height="8"  fill="#6DBF4A"/>
    <rect x="30" y="30" width="8"  height="12" fill="#FF6B6B"/>
    <rect x="38" y="30" width="22" height="12" fill="#60A0FF" opacity="0.9"/>
    <rect x="60" y="30" width="8"  height="12" fill="#A060FF"/>
    <rect x="34" y="42" width="30" height="10" fill="url(#rainbowGrad)" opacity="0.9"/>
    <rect x="38" y="52" width="8"  height="16" fill="#FF6B6B" opacity="0.7"/>
    <rect x="52" y="52" width="8"  height="16" fill="#6DBF4A" opacity="0.7"/>
    <!-- Name -->
    <rect x="8"  y="90" width="82" height="14" rx="2" fill="#0A0808" stroke="url(#rainbowGrad)" stroke-width="0.5"/>
    <text x="49" y="101" font-family="'Courier New', monospace" font-size="7" fill="url(#rainbowGrad)" text-anchor="middle" font-weight="700">RAINBOW KARTE</text>
    <rect x="8"  y="108" width="82" height="26" rx="2" fill="#0A0808"/>
    <rect x="12" y="112" width="74" height="5" rx="2" fill="url(#rainbowGrad)" opacity="0.5"/>
    <rect x="12" y="120" width="50" height="5" rx="2" fill="url(#rainbowGrad)" opacity="0.4"/>
    <text x="49" y="158" font-family="'Courier New', monospace" font-size="8" fill="url(#rainbowGrad)" text-anchor="middle" font-weight="700">RAINBOW</text>
  </g>

  <!-- SKETCH Card -->
  <g transform="translate(474, 16)">
    <rect x="0" y="0" width="98" height="140" rx="8" fill="#E8E0D0" stroke="#8A7A60" stroke-width="2"/>
    <!-- Paper texture lines -->
    <line x1="4"  y1="20"  x2="94" y2="20"  stroke="#C0B8A8" stroke-width="0.5" opacity="0.6"/>
    <line x1="4"  y1="28"  x2="94" y2="28"  stroke="#C0B8A8" stroke-width="0.5" opacity="0.4"/>
    <line x1="4"  y1="36"  x2="94" y2="36"  stroke="#C0B8A8" stroke-width="0.5" opacity="0.6"/>
    <line x1="4"  y1="44"  x2="94" y2="44"  stroke="#C0B8A8" stroke-width="0.5" opacity="0.4"/>
    <line x1="4"  y1="52"  x2="94" y2="52"  stroke="#C0B8A8" stroke-width="0.5" opacity="0.6"/>
    <!-- Sketch art (rough outline pixel style) -->
    <rect x="20" y="12" width="58" height="72" rx="2" fill="#E8E0D0"/>
    <!-- Sketch creature in pencil-style -->
    <rect x="36" y="18" width="26" height="8"  fill="none" stroke="#5A4A30" stroke-width="1.5"/>
    <rect x="28" y="26" width="42" height="16" fill="none" stroke="#5A4A30" stroke-width="1.5"/>
    <rect x="32" y="42" width="34" height="12" fill="none" stroke="#5A4A30" stroke-width="1.5"/>
    <rect x="36" y="54" width="10" height="20" fill="none" stroke="#5A4A30" stroke-width="1.5"/>
    <rect x="52" y="54" width="10" height="20" fill="none" stroke="#5A4A30" stroke-width="1.5"/>
    <!-- Sketch lines (hatching) -->
    <line x1="30" y1="28" x2="36" y2="40" stroke="#8A7A60" stroke-width="0.8" opacity="0.5"/>
    <line x1="36" y1="28" x2="42" y2="40" stroke="#8A7A60" stroke-width="0.8" opacity="0.5"/>
    <line x1="60" y1="28" x2="66" y2="40" stroke="#8A7A60" stroke-width="0.8" opacity="0.5"/>
    <!-- Name area (pencil) -->
    <line x1="8"  y1="92" x2="90" y2="92" stroke="#8A7A60" stroke-width="1"/>
    <text x="49" y="104" font-family="'Courier New', monospace" font-size="8" fill="#5A4A30" text-anchor="middle" font-weight="700">SKETCH</text>
    <!-- Stats pencil lines -->
    <line x1="12" y1="116" x2="60" y2="116" stroke="#8A7A60" stroke-width="1.5" opacity="0.6"/>
    <line x1="12" y1="124" x2="70" y2="124" stroke="#8A7A60" stroke-width="1.5" opacity="0.5"/>
    <line x1="12" y1="132" x2="50" y2="132" stroke="#8A7A60" stroke-width="1.5" opacity="0.6"/>
    <!-- Pencil mark corner -->
    <text x="82" y="138" font-family="'Courier New', monospace" font-size="7" fill="#8A7A60" opacity="0.5">✎</text>
    <text x="49" y="158" font-family="'Courier New', monospace" font-size="8" fill="#8A7A60" text-anchor="middle" font-weight="700">SKETCH</text>
  </g>
</svg>
