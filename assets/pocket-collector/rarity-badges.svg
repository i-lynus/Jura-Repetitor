<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="500" height="130">
  <defs>
    <!-- Common - stone -->
    <linearGradient id="commonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8A8A8A"/>
      <stop offset="100%" style="stop-color:#4A4A4A"/>
    </linearGradient>
    <!-- Uncommon - green -->
    <linearGradient id="uncommonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6DBF4A"/>
      <stop offset="100%" style="stop-color:#2D6B1A"/>
    </linearGradient>
    <!-- Rare - gold -->
    <linearGradient id="rareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5D060"/>
      <stop offset="100%" style="stop-color:#9A6810"/>
    </linearGradient>
    <!-- SR - blue -->
    <linearGradient id="srGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A0F5"/>
      <stop offset="100%" style="stop-color:#1040A0"/>
    </linearGradient>
    <!-- UR - prismatic rainbow -->
    <linearGradient id="urGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#FF6B6B"/>
      <stop offset="25%"  style="stop-color:#FFD700"/>
      <stop offset="50%"  style="stop-color:#6DBF4A"/>
      <stop offset="75%"  style="stop-color:#60A0F5"/>
      <stop offset="100%" style="stop-color:#C060FF"/>
    </linearGradient>
    <filter id="badgeGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="urGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- COMMON -->
  <g transform="translate(5, 15)">
    <rect x="0" y="0" width="78" height="90" rx="10" fill="#1A1A1A" stroke="url(#commonGrad)" stroke-width="2"/>
    <!-- Diamond shape -->
    <polygon points="39,12 58,36 39,60 20,36" fill="none" stroke="url(#commonGrad)" stroke-width="2.5"/>
    <polygon points="39,20 52,36 39,52 26,36" fill="#3A3A3A"/>
    <text x="39" y="78" font-family="'Courier New', monospace" font-size="9" letter-spacing="1"
          fill="#8A8A8A" text-anchor="middle" font-weight="700">COMMON</text>
    <!-- C label -->
    <text x="39" y="42" font-family="'Courier New', monospace" font-size="16" font-weight="900"
          fill="url(#commonGrad)" text-anchor="middle">C</text>
  </g>

  <!-- UNCOMMON -->
  <g transform="translate(98, 15)">
    <rect x="0" y="0" width="88" height="90" rx="10" fill="#0D1A0B" stroke="url(#uncommonGrad)" stroke-width="2"/>
    <polygon points="44,12 63,36 44,60 25,36" fill="none" stroke="url(#uncommonGrad)" stroke-width="2.5" filter="url(#badgeGlow)"/>
    <polygon points="44,20 57,36 44,52 31,36" fill="#1A3014"/>
    <text x="44" y="78" font-family="'Courier New', monospace" font-size="8" letter-spacing="1"
          fill="#6DBF4A" text-anchor="middle" font-weight="700">UNCOMMON</text>
    <text x="44" y="42" font-family="'Courier New', monospace" font-size="16" font-weight="900"
          fill="url(#uncommonGrad)" text-anchor="middle" filter="url(#badgeGlow)">U</text>
  </g>

  <!-- RARE -->
  <g transform="translate(200, 15)">
    <rect x="0" y="0" width="78" height="90" rx="10" fill="#1A1208" stroke="url(#rareGrad)" stroke-width="2.5" filter="url(#badgeGlow)"/>
    <!-- Star shape for rare -->
    <polygon points="39,10 43,24 58,24 46,33 50,47 39,38 28,47 32,33 20,24 35,24"
             fill="none" stroke="url(#rareGrad)" stroke-width="2" filter="url(#badgeGlow)"/>
    <polygon points="39,16 42,26 52,26 44,32 47,42 39,36 31,42 34,32 26,26 36,26"
             fill="#3A2808"/>
    <text x="39" y="78" font-family="'Courier New', monospace" font-size="9" letter-spacing="2"
          fill="#F5D060" text-anchor="middle" font-weight="700">RARE</text>
    <text x="39" y="44" font-family="'Courier New', monospace" font-size="14" font-weight="900"
          fill="url(#rareGrad)" text-anchor="middle" filter="url(#badgeGlow)">R</text>
  </g>

  <!-- SUPER RARE -->
  <g transform="translate(292, 15)">
    <rect x="0" y="0" width="88" height="90" rx="10" fill="#080D1A" stroke="url(#srGrad)" stroke-width="2.5" filter="url(#badgeGlow)"/>
    <!-- Hexagon for SR -->
    <polygon points="44,10 64,22 64,46 44,58 24,46 24,22" fill="none" stroke="url(#srGrad)" stroke-width="2.5" filter="url(#badgeGlow)"/>
    <polygon points="44,17 58,25 58,41 44,49 30,41 30,25" fill="#081028"/>
    <text x="44" y="78" font-family="'Courier New', monospace" font-size="7" letter-spacing="1"
          fill="#60A0F5" text-anchor="middle" font-weight="700">SUPER RARE</text>
    <text x="44" y="42" font-family="'Courier New', monospace" font-size="14" font-weight="900"
          fill="url(#srGrad)" text-anchor="middle" filter="url(#badgeGlow)">SR</text>
  </g>

  <!-- ULTRA RARE -->
  <g transform="translate(394, 15)">
    <rect x="0" y="0" width="96" height="90" rx="10" fill="#0A0808" stroke="url(#urGrad)" stroke-width="3" filter="url(#urGlow)"/>
    <!-- Double diamond for UR -->
    <polygon points="48,8 72,34 48,60 24,34" fill="none" stroke="url(#urGrad)" stroke-width="2" filter="url(#urGlow)"/>
    <polygon points="48,14 66,34 48,54 30,34" fill="#1A0808" stroke="url(#urGrad)" stroke-width="1" opacity="0.4"/>
    <!-- Inner smaller diamond -->
    <polygon points="48,22 58,34 48,46 38,34" fill="#1A0808"/>
    <text x="48" y="78" font-family="'Courier New', monospace" font-size="7" letter-spacing="1"
          fill="url(#urGrad)" text-anchor="middle" font-weight="900" filter="url(#urGlow)">ULTRA RARE</text>
    <text x="48" y="42" font-family="'Courier New', monospace" font-size="14" font-weight="900"
          fill="url(#urGrad)" text-anchor="middle" filter="url(#urGlow)">UR</text>
  </g>
</svg>
