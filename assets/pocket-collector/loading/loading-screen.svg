<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="loadSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A1A06"/><stop offset="60%" stop-color="#16280E"/><stop offset="100%" stop-color="#1A2E10"/>
    </linearGradient>
    <linearGradient id="loadGround" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A4A18"/><stop offset="100%" stop-color="#0E1A08"/>
    </linearGradient>
    <linearGradient id="loadBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A9B30"/><stop offset="70%" stop-color="#6DBF4A"/><stop offset="100%" stop-color="#F5D060"/>
    </linearGradient>
    <linearGradient id="loadGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5D060"/><stop offset="100%" stop-color="#9A6810"/>
    </linearGradient>
    <filter id="loadGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="starTwinkle">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="640" height="360" rx="0" fill="url(#loadSky)"/>

  <!-- Twinkling stars -->
  <circle cx="80"  cy="40" r="2"   fill="#F5D060" filter="url(#starTwinkle)">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
  <circle cx="200" cy="28" r="1.5" fill="#A8E060" filter="url(#starTwinkle)">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="480" cy="34" r="2"   fill="#F5D060" filter="url(#starTwinkle)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/></circle>
  <circle cx="560" cy="55" r="1.5" fill="#FFD700" filter="url(#starTwinkle)">
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="330" cy="48" r="1.5" fill="#6DBF4A" filter="url(#starTwinkle)">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.4s" repeatCount="indefinite"/></circle>

  <!-- Background pixel trees (silhouette) -->
  <g opacity="0.5">
    <rect x="60"  y="190" width="14" height="60" fill="#1A3010"/>
    <rect x="40"  y="160" width="54" height="34" fill="#1F3814"/>
    <rect x="50"  y="138" width="34" height="28" fill="#264218"/>
    <rect x="540" y="195" width="14" height="55" fill="#1A3010"/>
    <rect x="522" y="168" width="50" height="32" fill="#1F3814"/>
    <rect x="532" y="148" width="30" height="24" fill="#264218"/>
  </g>

  <!-- Central fountain (the garden centerpiece) -->
  <g transform="translate(290, 150)">
    <rect x="0"  y="78" width="64" height="10" rx="4" fill="#4A4840"/>
    <rect x="6"  y="58" width="52" height="22" rx="4" fill="#3A3830"/>
    <rect x="10" y="62" width="44" height="14" rx="2" fill="#1A4A7A"/>
    <rect x="12" y="62" width="40" height="4"  fill="#3A8ABF" opacity="0.7"/>
    <rect x="28" y="28" width="8"  height="32" fill="#4A4840"/>
    <rect x="18" y="20" width="28" height="10" rx="4" fill="#3A3830"/>
    <rect x="22" y="22" width="20" height="6"  rx="2" fill="#3A8ABF" opacity="0.6"/>
    <rect x="29" y="10" width="6"  height="12" fill="#5A5850"/>
    <rect x="26" y="6"  width="12" height="6"  rx="3" fill="#6A6860"/>
    <!-- Water particles animating up -->
    <circle cx="20" cy="40" r="2" fill="#7BBFEE">
      <animate attributeName="cy" values="40;20;40" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="44" cy="42" r="2" fill="#A8D8FF">
      <animate attributeName="cy" values="42;22;42" dur="1.4s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="1.4s" begin="0.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Floating fireflies -->
  <circle cx="180" cy="160" r="3" fill="#F5D060" filter="url(#loadGlow)">
    <animate attributeName="cy" values="160;140;160" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="470" cy="150" r="2.5" fill="#A8E060" filter="url(#loadGlow)">
    <animate attributeName="cy" values="150;132;150" dur="3.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/></circle>

  <!-- Ground -->
  <rect x="0" y="250" width="640" height="110" fill="url(#loadGround)"/>
  <line x1="0" y1="252" x2="640" y2="252" stroke="#3A6B20" stroke-width="1.5" opacity="0.4"/>
  <!-- Grass tufts -->
  <rect x="120" y="246" width="5" height="10" fill="#4A9B30"/>
  <rect x="220" y="247" width="5" height="9"  fill="#5DB840"/>
  <rect x="410" y="246" width="5" height="10" fill="#4A9B30"/>
  <rect x="500" y="247" width="5" height="9"  fill="#5DB840"/>

  <!-- LOGO wordmark -->
  <text x="320" y="296" font-family="'Courier New', monospace" font-size="26" font-weight="900" letter-spacing="4" fill="url(#loadGold)" text-anchor="middle" filter="url(#loadGlow)">POCKET COLLECTOR</text>

  <!-- LOADING BAR -->
  <g transform="translate(170, 312)">
    <rect x="0" y="0" width="300" height="16" rx="8" fill="#0A0804" stroke="#5A4030" stroke-width="1.5"/>
    <!-- Animated fill -->
    <rect x="2" y="2" width="40" height="12" rx="6" fill="url(#loadBar)">
      <animate attributeName="width" values="20;120;220;296;296" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <!-- Shine streak -->
    <rect x="2" y="3" width="40" height="4" rx="2" fill="#FFFFFF" opacity="0.15">
      <animate attributeName="x" values="2;120;240;260;2" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <!-- Leaf icon at bar end (moving) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="20,0;110,0;210,0;286,0;286,0" dur="2.8s" repeatCount="indefinite"/>
      <rect x="-4" y="3"  width="4" height="4" fill="#6DBF4A"/>
      <rect x="0"  y="3"  width="4" height="4" fill="#6DBF4A"/>
      <rect x="-6" y="7"  width="4" height="4" fill="#4A9B30"/>
      <rect x="-2" y="7"  width="4" height="4" fill="#A8E060"/>
      <rect x="2"  y="7"  width="4" height="4" fill="#6DBF4A"/>
      <rect x="-2" y="11" width="4" height="4" fill="#2D6B1A"/>
    </g>
  </g>

  <!-- Loading percentage + tip -->
  <text x="320" y="346" font-family="'Courier New', monospace" font-size="10" fill="#C8922A" text-anchor="middle" opacity="0.8">
    Lade deinen Garten...
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="1.6s" repeatCount="indefinite"/>
  </text>
  <text x="610" y="346" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#F5D060" text-anchor="end">
    <animate attributeName="opacity" values="1;1;1" dur="2.8s" repeatCount="indefinite"/>74%</text>

  <!-- Corner ornaments -->
  <rect x="12" y="12" width="8" height="8" fill="#F5D060" opacity="0.5"/>
  <rect x="620" y="12" width="8" height="8" fill="#F5D060" opacity="0.5"/>
</svg>
