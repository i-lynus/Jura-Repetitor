<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="battleBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2E10"/><stop offset="100%" stop-color="#0A1606"/>
    </linearGradient>
    <linearGradient id="fieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A5A28"/><stop offset="100%" stop-color="#24401A"/>
    </linearGradient>
    <linearGradient id="battleGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5D060"/><stop offset="100%" stop-color="#9A6810"/>
    </linearGradient>
    <linearGradient id="hpGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A9B30"/><stop offset="100%" stop-color="#6DBF4A"/>
    </linearGradient>
    <linearGradient id="hpRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C83020"/><stop offset="100%" stop-color="#E84040"/>
    </linearGradient>
    <filter id="battleGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="vsBurst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5D060" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F5D060" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="640" height="400" rx="12" fill="url(#battleBg)" stroke="#3A5A28" stroke-width="2"/>

  <!-- Top header bar -->
  <rect x="0" y="0" width="640" height="40" rx="12" fill="#0D1A08"/>
  <rect x="0" y="28" width="640" height="12" fill="#0D1A08"/>
  <text x="320" y="26" font-family="'Courier New', monospace" font-size="12" font-weight="700" letter-spacing="4" fill="#F5D060" text-anchor="middle" filter="url(#battleGlow)">DUELL ARENA</text>
  <!-- Turn indicator -->
  <rect x="270" y="46" width="100" height="20" rx="10" fill="#1A1208" stroke="#C8922A" stroke-width="1"/>
  <text x="320" y="60" font-family="'Courier New', monospace" font-size="9" fill="#F5D060" text-anchor="middle">RUNDE 3</text>

  <!-- ===== OPPONENT (top) ===== -->
  <g transform="translate(20, 50)">
    <!-- Avatar -->
    <rect x="0" y="0" width="48" height="48" rx="6" fill="#2A1818" stroke="#E84040" stroke-width="2"/>
    <rect x="8" y="6" width="32" height="8" fill="#3A2010"/>
    <rect x="8" y="14" width="32" height="22" fill="#D89870" rx="2"/>
    <rect x="14" y="20" width="6" height="6" fill="#1A1A1A"/>
    <rect x="28" y="20" width="6" height="6" fill="#1A1A1A"/>
    <rect x="16" y="30" width="16" height="3" fill="#A05030" opacity="0.6"/>
    <!-- Name + HP -->
    <text x="58" y="14" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#E8D0A0">Rivale Sam</text>
    <!-- HP bar -->
    <rect x="58" y="22" width="180" height="12" rx="4" fill="#0A0804" stroke="#5A4030" stroke-width="1"/>
    <rect x="60" y="24" width="100" height="8" rx="3" fill="url(#hpRed)"/>
    <text x="244" y="32" font-family="'Courier New', monospace" font-size="8" fill="#E84040">120/220</text>
    <!-- Status icon (poisoned) -->
    <circle cx="252" cy="10" r="9" fill="#4A1870" stroke="#A040E8" stroke-width="1"/>
    <rect x="248" y="6" width="8" height="8" rx="4" fill="#C080FF" opacity="0.8"/>
  </g>
  <!-- Opponent's deck count -->
  <g transform="translate(580, 54)">
    <rect x="0" y="0" width="40" height="40" rx="4" fill="#1A0E0E" stroke="#8A2020" stroke-width="1.5"/>
    <rect x="6" y="6" width="28" height="28" rx="2" fill="#2A1818"/>
    <polygon points="20,12 23,18 30,18 25,22 27,28 20,24 13,28 15,22 10,18 17,18" fill="#8A2020" opacity="0.7"/>
    <text x="20" y="38" font-family="'Courier New', monospace" font-size="7" fill="#E84040" text-anchor="middle">×24</text>
  </g>

  <!-- ===== VS BADGE (center) ===== -->
  <circle cx="320" cy="200" r="50" fill="url(#vsBurst)"/>
  <text x="320" y="212" font-family="'Courier New', monospace" font-size="38" font-weight="900" fill="url(#battleGold)" text-anchor="middle" filter="url(#battleGlow)">VS</text>

  <!-- ===== BATTLE FIELD (center) ===== -->
  <g transform="translate(70, 120)">
    <!-- Field perspective -->
    <polygon points="0,160 500,160 440,30 60,30" fill="url(#fieldGrad)" stroke="#4A6B30" stroke-width="2"/>
    <!-- Center line -->
    <line x1="50" y1="95" x2="450" y2="95" stroke="#5A7B40" stroke-width="1.5" opacity="0.5"/>
    <!-- Grid lines -->
    <line x1="180" y1="30" x2="150" y2="160" stroke="#4A6B30" stroke-width="1" opacity="0.3"/>
    <line x1="320" y1="30" x2="350" y2="160" stroke="#4A6B30" stroke-width="1" opacity="0.3"/>

    <!-- Opponent card slots (top, 3) -->
    <g opacity="0.9">
      <rect x="130" y="36" width="44" height="58" rx="4" fill="#2A1818" stroke="#8A2020" stroke-width="1.5"/>
      <rect x="135" y="41" width="34" height="38" rx="2" fill="#3A2424"/>
      <rect x="210" y="36" width="48" height="62" rx="4" fill="#2A1818" stroke="#E84040" stroke-width="2" filter="url(#battleGlow)"/>
      <rect x="215" y="41" width="38" height="42" rx="2" fill="#4A2828"/>
      <!-- Active opponent creature -->
      <polygon points="234,48 244,58 234,74 224,58" fill="#E84040" opacity="0.7"/>
      <rect x="294" y="40" width="44" height="58" rx="4" fill="#1A1010" stroke="#5A4030" stroke-width="1" opacity="0.5"/>
    </g>

    <!-- Player card slots (bottom, 3) -->
    <g>
      <rect x="120" y="100" width="48" height="62" rx="4" fill="#1A2A48" stroke="#5A8AB8" stroke-width="1.5"/>
      <rect x="125" y="105" width="38" height="42" rx="2" fill="#24324A"/>
      <!-- Active player creature (flame dragon, generic) -->
      <rect x="200" y="96" width="52" height="68" rx="4" fill="#2A1A08" stroke="url(#battleGold)" stroke-width="2.5" filter="url(#battleGlow)"/>
      <rect x="205" y="101" width="42" height="46" rx="2" fill="#3A2410"/>
      <!-- Pixel flame creature -->
      <rect x="216" y="106" width="20" height="6"  fill="#FF8020"/>
      <rect x="210" y="112" width="32" height="14" fill="#E84040"/>
      <rect x="214" y="126" width="24" height="10" fill="#C83020"/>
      <rect x="218" y="108" width="5" height="5" fill="#FFD700"/>
      <rect x="230" y="108" width="5" height="5" fill="#FFD700"/>
      <!-- Wings -->
      <rect x="202" y="114" width="8" height="14" fill="#9A2818" opacity="0.7"/>
      <rect x="242" y="114" width="8" height="14" fill="#9A2818" opacity="0.7"/>
      <rect x="290" y="100" width="48" height="62" rx="4" fill="#10182A" stroke="#5A4030" stroke-width="1" opacity="0.5"/>
    </g>
  </g>

  <!-- ===== PLAYER (bottom) ===== -->
  <g transform="translate(20, 300)">
    <!-- Avatar -->
    <rect x="0" y="0" width="48" height="48" rx="6" fill="#2D4A1A" stroke="#6DBF4A" stroke-width="2"/>
    <rect x="8" y="6" width="32" height="8" fill="#3A2010"/>
    <rect x="8" y="14" width="32" height="22" fill="#E8B880" rx="2"/>
    <rect x="14" y="20" width="6" height="6" fill="#1A4080"/>
    <rect x="28" y="20" width="6" height="6" fill="#1A4080"/>
    <rect x="16" y="30" width="16" height="3" fill="#C87040" opacity="0.6"/>
    <!-- Name + HP -->
    <text x="58" y="14" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#E8D0A0">Archivist I</text>
    <rect x="58" y="22" width="180" height="12" rx="4" fill="#0A0804" stroke="#5A4030" stroke-width="1"/>
    <rect x="60" y="24" width="156" height="8" rx="3" fill="url(#hpGreen)"/>
    <text x="244" y="32" font-family="'Courier New', monospace" font-size="8" fill="#6DBF4A">186/220</text>
    <!-- Status shield -->
    <circle cx="252" cy="10" r="9" fill="#0A2018" stroke="#40E0A0" stroke-width="1"/>
    <path d="M249,6 L255,6 L255,11 Q255,14 252,15 Q249,14 249,11 Z" fill="#40E0A0" opacity="0.7"/>
  </g>

  <!-- Player hand (cards fanned, bottom right) -->
  <g transform="translate(330, 318)">
    <rect x="0"  y="10" width="40" height="56" rx="4" fill="#1A1208" stroke="#C8922A" stroke-width="1.5" transform="rotate(-12,20,38)"/>
    <rect x="30" y="6"  width="40" height="56" rx="4" fill="#1A1208" stroke="#C8922A" stroke-width="1.5" transform="rotate(-4,50,34)"/>
    <rect x="62" y="4"  width="40" height="56" rx="4" fill="#1A1208" stroke="#C8922A" stroke-width="1.5"/>
    <rect x="96" y="6"  width="40" height="56" rx="4" fill="#1A1208" stroke="#C8922A" stroke-width="1.5" transform="rotate(4,116,34)"/>
    <rect x="126" y="10" width="40" height="56" rx="4" fill="#1A1208" stroke="#C8922A" stroke-width="1.5" transform="rotate(12,146,38)"/>
    <!-- Mini card art on front card -->
    <rect x="67" y="9" width="30" height="26" rx="2" fill="#3A2410"/>
    <rect x="74" y="14" width="16" height="6" fill="#6DBF4A" opacity="0.6"/>
  </g>

  <!-- Action buttons (bottom right) -->
  <g transform="translate(516, 348)">
    <rect x="0" y="0" width="106" height="36" rx="8" fill="#104020" stroke="#6DBF4A" stroke-width="2" filter="url(#battleGlow)"/>
    <text x="53" y="23" font-family="'Courier New', monospace" font-size="11" font-weight="700" letter-spacing="2" fill="#A8E060" text-anchor="middle">ANGRIFF</text>
  </g>

  <!-- Status effect legend (right side mini) -->
  <g transform="translate(584, 110)">
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="7" fill="#8A7A60" opacity="0.7">STATUS</text>
    <circle cx="8" cy="14" r="7" fill="#4A1870" stroke="#A040E8" stroke-width="1"/>
    <rect x="5" y="11" width="6" height="6" rx="3" fill="#C080FF"/>
    <circle cx="8" cy="34" r="7" fill="#5A2008" stroke="#E87020" stroke-width="1"/>
    <polygon points="8,28 11,34 5,34" fill="#FF8020"/>
    <circle cx="8" cy="54" r="7" fill="#5A4A08" stroke="#E8C820" stroke-width="1"/>
    <polygon points="10,48 6,54 9,54 5,60 8,54 10,54" fill="#FFD700"/>
  </g>
</svg>
