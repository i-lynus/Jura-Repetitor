<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1C2A1A"/>
      <stop offset="100%" style="stop-color:#0D1A0B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5D060"/>
      <stop offset="50%" style="stop-color:#C8922A"/>
      <stop offset="100%" style="stop-color:#7A5010"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6DBF4A"/>
      <stop offset="100%" style="stop-color:#2D6B1A"/>
    </linearGradient>
    <linearGradient id="glowGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A8E060;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#2D6B1A;stop-opacity:0"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="goldGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Rounded square clip -->
    <clipPath id="roundedIcon">
      <rect x="0" y="0" width="512" height="512" rx="100" ry="100"/>
    </clipPath>
  </defs>

  <!-- Background (rounded square) -->
  <rect x="0" y="0" width="512" height="512" rx="100" ry="100" fill="url(#bgGrad)"/>

  <!-- Outer border frame -->
  <rect x="14" y="14" width="484" height="484" rx="88" ry="88"
        fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.7"/>
  <rect x="22" y="22" width="468" height="468" rx="82" ry="82"
        fill="none" stroke="#C8922A" stroke-width="1" opacity="0.3"/>

  <!-- Pixel Art Garden Scene (centered) -->
  <!-- Ground / grass base -->
  <g clip-path="url(#roundedIcon)">
    <!-- Sky background gradient in icon -->
    <rect x="80" y="100" width="352" height="240" fill="#0D1A0B" opacity="0.5" rx="8"/>

    <!-- PIXEL ART TREE (center-left) -->
    <!-- Trunk -->
    <rect x="168" y="240" width="16" height="40" fill="#5C3A1E"/>
    <rect x="172" y="240" width="6" height="40" fill="#7A5030"/>
    <!-- Foliage layers (pyramid) -->
    <rect x="144" y="216" width="64" height="28" fill="#4A9B30"/>
    <rect x="152" y="200" width="48" height="20" fill="#5DB840"/>
    <rect x="160" y="186" width="32" height="18" fill="#6DBF4A"/>
    <rect x="164" y="174" width="24" height="16" fill="#A8E060"/>
    <!-- Foliage highlights -->
    <rect x="152" y="202" width="12" height="6" fill="#A8E060" opacity="0.4"/>

    <!-- PIXEL ART TREE (right) -->
    <rect x="288" y="248" width="12" height="32" fill="#5C3A1E"/>
    <rect x="291" y="248" width="4" height="32" fill="#7A5030"/>
    <rect x="268" y="228" width="52" height="24" fill="#2D6B1A"/>
    <rect x="274" y="214" width="40" height="18" fill="#4A9B30"/>
    <rect x="280" y="202" width="28" height="16" fill="#5DB840"/>
    <rect x="284" y="192" width="20" height="14" fill="#6DBF4A"/>

    <!-- Flower patch (left) -->
    <rect x="120" y="272" width="8" height="16" fill="#3A6B20"/>
    <rect x="116" y="264" width="8" height="8" fill="#E84040"/>
    <rect x="124" y="260" width="8" height="8" fill="#FFD700"/>
    <rect x="118" y="256" width="8" height="8" fill="#FF6B6B"/>

    <!-- Flower patch (right) -->
    <rect x="360" y="268" width="8" height="20" fill="#3A6B20"/>
    <rect x="356" y="260" width="8" height="8" fill="#A040E8"/>
    <rect x="364" y="256" width="8" height="8" fill="#E84080"/>
    <rect x="358" y="252" width="8" height="8" fill="#FF9B40"/>

    <!-- Stone path (pixel) -->
    <rect x="220" y="280" width="20" height="12" fill="#6A6A6A" rx="2"/>
    <rect x="244" y="284" width="18" height="12" fill="#5A5A5A" rx="2"/>
    <rect x="266" y="278" width="20" height="12" fill="#6A6A6A" rx="2"/>

    <!-- Small chest / card box pixel art -->
    <rect x="226" y="236" width="60" height="44" fill="#7A5010"/>
    <rect x="226" y="236" width="60" height="8"  fill="#C8922A"/>
    <rect x="229" y="239" width="54" height="2"  fill="#F5D060" opacity="0.5"/>
    <!-- Chest lock -->
    <rect x="250" y="252" width="12" height="10" fill="#C8922A"/>
    <rect x="253" y="255" width="6" height="4"   fill="#F5D060"/>
    <!-- Chest shine -->
    <rect x="229" y="244" width="20" height="4" fill="#C8922A" opacity="0.3"/>

    <!-- Grass / ground -->
    <rect x="80" y="290" width="352" height="50" fill="#2A4A18"/>
    <!-- Grass texture pixels -->
    <rect x="100" y="288" width="4" height="8"  fill="#4A9B30"/>
    <rect x="130" y="286" width="4" height="10" fill="#5DB840"/>
    <rect x="160" y="288" width="4" height="8"  fill="#4A9B30"/>
    <rect x="320" y="287" width="4" height="9"  fill="#4A9B30"/>
    <rect x="360" y="288" width="4" height="8"  fill="#5DB840"/>
    <rect x="390" y="286" width="4" height="10" fill="#4A9B30"/>

    <!-- Lantern post (left) -->
    <rect x="140" y="238" width="6" height="40" fill="#8B6914"/>
    <rect x="134" y="226" width="18" height="18" fill="#C8922A" rx="3"/>
    <rect x="138" y="230" width="10" height="10" fill="#FFD700" opacity="0.8"/>
    <!-- Lantern glow -->
    <circle cx="143" cy="235" r="12" fill="#FFD700" opacity="0.12"/>

    <!-- Lantern post (right) -->
    <rect x="366" y="238" width="6" height="40" fill="#8B6914"/>
    <rect x="360" y="226" width="18" height="18" fill="#C8922A" rx="3"/>
    <rect x="364" y="230" width="10" height="10" fill="#FFD700" opacity="0.8"/>
    <circle cx="369" cy="235" r="12" fill="#FFD700" opacity="0.12"/>

    <!-- Sparkling stars / fireflies -->
    <circle cx="200" cy="160" r="3" fill="#F5D060" opacity="0.9"/>
    <circle cx="200" cy="160" r="6" fill="#F5D060" opacity="0.2"/>
    <circle cx="320" cy="148" r="2" fill="#A8E060" opacity="0.9"/>
    <circle cx="320" cy="148" r="5" fill="#A8E060" opacity="0.2"/>
    <circle cx="260" cy="140" r="2" fill="#FFD700" opacity="0.8"/>
    <circle cx="380" cy="170" r="2" fill="#6DBF4A" opacity="0.9"/>
    <circle cx="150" cy="180" r="2" fill="#F5D060" opacity="0.7"/>
  </g>

  <!-- Pixel-art "PC" monogram at bottom -->
  <!-- P -->
  <g transform="translate(196, 370)" filter="url(#goldGlow)">
    <rect x="0" y="0"  width="6" height="30" fill="url(#goldGrad)"/>
    <rect x="6" y="0"  width="12" height="6"  fill="url(#goldGrad)"/>
    <rect x="18" y="6" width="6" height="6"  fill="url(#goldGrad)"/>
    <rect x="6" y="12" width="12" height="6" fill="url(#goldGrad)"/>
  </g>
  <!-- C -->
  <g transform="translate(234, 370)" filter="url(#goldGlow)">
    <rect x="6" y="0"  width="12" height="6" fill="url(#goldGrad)"/>
    <rect x="0" y="6"  width="6"  height="6" fill="url(#goldGrad)"/>
    <rect x="0" y="18" width="6"  height="6" fill="url(#goldGrad)"/>
    <rect x="6" y="24" width="12" height="6" fill="url(#goldGrad)"/>
  </g>

  <!-- Decorative leaf badge top-right -->
  <g transform="translate(370, 50)" filter="url(#softGlow)">
    <circle cx="30" cy="30" r="28" fill="#1C3A14" stroke="#4A9B30" stroke-width="2"/>
    <!-- Pixel leaf inside badge -->
    <rect x="22" y="14" width="5" height="5" fill="#6DBF4A"/>
    <rect x="27" y="14" width="5" height="5" fill="#6DBF4A"/>
    <rect x="17" y="19" width="5" height="5" fill="#4A9B30"/>
    <rect x="22" y="19" width="5" height="5" fill="#A8E060"/>
    <rect x="27" y="19" width="5" height="5" fill="#6DBF4A"/>
    <rect x="32" y="19" width="5" height="5" fill="#4A9B30"/>
    <rect x="17" y="24" width="5" height="5" fill="#4A9B30"/>
    <rect x="22" y="24" width="5" height="5" fill="#A8E060"/>
    <rect x="27" y="24" width="5" height="5" fill="#6DBF4A"/>
    <rect x="22" y="29" width="5" height="5" fill="#4A9B30"/>
    <rect x="22" y="34" width="5" height="5" fill="#2D6B1A"/>
    <rect x="22" y="39" width="5" height="5" fill="#2D6B1A"/>
  </g>

  <!-- Bottom tagline -->
  <text x="256" y="470"
        font-family="'Courier New', monospace"
        font-size="13"
        font-weight="700"
        letter-spacing="3"
        fill="#C8922A"
        text-anchor="middle"
        opacity="0.9"
  >POCKET COLLECTOR</text>
</svg>
