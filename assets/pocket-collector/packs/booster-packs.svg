<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="basisPack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A5A88"/><stop offset="100%" stop-color="#1A2A48"/>
    </linearGradient>
    <linearGradient id="junglePack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D6B1A"/><stop offset="100%" stop-color="#0D2A08"/>
    </linearGradient>
    <linearGradient id="premiumPack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A6810"/><stop offset="50%" stop-color="#C8922A"/><stop offset="100%" stop-color="#5A3808"/>
    </linearGradient>
    <linearGradient id="boosterBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A2010"/><stop offset="100%" stop-color="#1A0808"/>
    </linearGradient>
    <linearGradient id="packShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="packGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="packShadow">
      <feDropShadow dx="4" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- BASIS PACK -->
  <g transform="translate(14,20)" filter="url(#packShadow)">
    <!-- Pack body -->
    <rect x="0" y="0" width="90" height="130" rx="6" fill="url(#basisPack)" stroke="#5A8AB8" stroke-width="1.5"/>
    <!-- Top tear strip -->
    <rect x="0" y="0" width="90" height="20" rx="6" fill="#5A8AB8" opacity="0.6"/>
    <line x1="0" y1="20" x2="90" y2="20" stroke="#3A5A88" stroke-width="1"/>
    <!-- Zigzag tear line -->
    <polyline points="0,20 8,16 16,20 24,16 32,20 40,16 48,20 56,16 64,20 72,16 80,20 90,18"
              fill="none" stroke="#AACCEE" stroke-width="1" opacity="0.4"/>
    <!-- Pack art area -->
    <rect x="8" y="26" width="74" height="60" rx="3" fill="#0D1A2A" opacity="0.7"/>
    <!-- Pixel art silhouette (Pikachu-style shape placeholder) -->
    <rect x="32" y="34" width="26" height="6"  fill="#FFD700" opacity="0.8"/>
    <rect x="26" y="40" width="38" height="12" fill="#FFD700" opacity="0.8"/>
    <rect x="28" y="52" width="34" height="10" fill="#FFB830" opacity="0.7"/>
    <rect x="32" y="62" width="26" height="8"  fill="#D4920A" opacity="0.6"/>
    <!-- Ears pixel -->
    <rect x="28" y="22" width="8" height="14" fill="#FFD700" opacity="0.7"/>
    <rect x="52" y="22" width="8" height="14" fill="#FFD700" opacity="0.7"/>
    <rect x="30" y="24" width="4" height="8"  fill="#1A0808" opacity="0.5"/>
    <rect x="54" y="24" width="4" height="8"  fill="#1A0808" opacity="0.5"/>
    <!-- Name area -->
    <rect x="8"  y="92" width="74" height="20" fill="#1A2A48"/>
    <text x="45" y="106" font-family="'Courier New', monospace" font-size="9" font-weight="700"
          letter-spacing="1" fill="#AACCEE" text-anchor="middle">BASIS PACK</text>
    <!-- Bottom info -->
    <rect x="8" y="116" width="74" height="10" fill="#0D1A2A" opacity="0.5"/>
    <text x="45" y="124" font-family="'Courier New', monospace" font-size="7"
          fill="#5A8AB8" text-anchor="middle">5 KARTEN</text>
    <!-- Shine -->
    <rect x="0" y="0" width="90" height="130" rx="6" fill="url(#packShine)"/>
    <!-- Corner rip detail -->
    <polygon points="78,2 90,2 90,14" fill="#AACCEE" opacity="0.15"/>
  </g>

  <!-- JUNGLE PACK -->
  <g transform="translate(130,20)" filter="url(#packShadow)">
    <rect x="0" y="0" width="90" height="130" rx="6" fill="url(#junglePack)" stroke="#4A9B30" stroke-width="1.5"/>
    <rect x="0" y="0" width="90" height="20" rx="6" fill="#4A9B30" opacity="0.6"/>
    <line x1="0" y1="20" x2="90" y2="20" stroke="#2D6B1A" stroke-width="1"/>
    <polyline points="0,20 8,16 16,20 24,16 32,20 40,16 48,20 56,16 64,20 72,16 80,20 90,18"
              fill="none" stroke="#A8E060" stroke-width="1" opacity="0.4"/>
    <!-- Art area -->
    <rect x="8" y="26" width="74" height="60" rx="3" fill="#0A1A06" opacity="0.7"/>
    <!-- Jungle pixel art (leaves + creature) -->
    <rect x="14" y="32" width="18" height="30" fill="#2D6B1A" opacity="0.8"/>
    <rect x="16" y="28" width="14" height="8"  fill="#4A9B30" opacity="0.8"/>
    <rect x="58" y="30" width="18" height="32" fill="#2D6B1A" opacity="0.8"/>
    <rect x="60" y="26" width="14" height="8"  fill="#4A9B30" opacity="0.8"/>
    <!-- creature center -->
    <rect x="32" y="42" width="26" height="20" fill="#6DBF4A" opacity="0.9"/>
    <rect x="34" y="38" width="22" height="6"  fill="#A8E060" opacity="0.7"/>
    <rect x="36" y="60" width="6"  height="10" fill="#4A9B30"/>
    <rect x="46" y="60" width="6"  height="10" fill="#4A9B30"/>
    <!-- Eyes pixel -->
    <rect x="36" y="44" width="5" height="5"  fill="#1A0808"/>
    <rect x="47" y="44" width="5" height="5"  fill="#1A0808"/>
    <!-- Name -->
    <rect x="8"  y="92" width="74" height="20" fill="#0D1A08"/>
    <text x="45" y="106" font-family="'Courier New', monospace" font-size="9" font-weight="700"
          letter-spacing="1" fill="#A8E060" text-anchor="middle">JUNGLE PACK</text>
    <rect x="8" y="116" width="74" height="10" fill="#0A1206" opacity="0.5"/>
    <text x="45" y="124" font-family="'Courier New', monospace" font-size="7"
          fill="#4A9B30" text-anchor="middle">5 KARTEN</text>
    <rect x="0" y="0" width="90" height="130" rx="6" fill="url(#packShine)"/>
    <polygon points="78,2 90,2 90,14" fill="#A8E060" opacity="0.15"/>
  </g>

  <!-- PREMIUM PACK -->
  <g transform="translate(246,10)" filter="url(#packShadow)">
    <rect x="0" y="0" width="100" height="150" rx="6" fill="#1A1004" stroke="url(#premiumPack)" stroke-width="2.5" filter="url(#packGlow)"/>
    <rect x="0" y="0" width="100" height="24" rx="6" fill="#C8922A" opacity="0.7"/>
    <line x1="0" y1="24" x2="100" y2="24" stroke="#9A6810" stroke-width="1"/>
    <polyline points="0,24 10,18 20,24 30,18 40,24 50,18 60,24 70,18 80,24 90,18 100,22"
              fill="none" stroke="#F5D060" stroke-width="1" opacity="0.5"/>
    <!-- Stars top -->
    <polygon points="50,6 52,12 58,12 53,16 55,22 50,18 45,22 47,16 42,12 48,12"
             fill="#F5D060" filter="url(#packGlow)" opacity="0.9"/>
    <!-- Art area -->
    <rect x="8" y="30" width="84" height="76" rx="3" fill="#0A0804" opacity="0.8"/>
    <!-- Holographic shimmer lines inside art -->
    <rect x="8"  y="32" width="84" height="4" fill="#FFD700" opacity="0.06"/>
    <rect x="8"  y="40" width="84" height="4" fill="#FF80FF" opacity="0.06"/>
    <rect x="8"  y="48" width="84" height="4" fill="#60A0FF" opacity="0.06"/>
    <rect x="8"  y="56" width="84" height="4" fill="#60FF80" opacity="0.06"/>
    <rect x="8"  y="64" width="84" height="4" fill="#FFD700" opacity="0.06"/>
    <rect x="8"  y="72" width="84" height="4" fill="#FF80FF" opacity="0.06"/>
    <rect x="8"  y="80" width="84" height="4" fill="#60A0FF" opacity="0.06"/>
    <rect x="8"  y="88" width="84" height="4" fill="#FFD700" opacity="0.06"/>
    <!-- Mega creature pixel silhouette -->
    <rect x="38" y="36" width="24" height="8"  fill="#F5D060" opacity="0.7"/>
    <rect x="30" y="44" width="40" height="16" fill="#C8922A" opacity="0.8"/>
    <rect x="32" y="60" width="36" height="16" fill="#9A6810" opacity="0.7"/>
    <rect x="36" y="76" width="10" height="20" fill="#7A5010" opacity="0.6"/>
    <rect x="54" y="76" width="10" height="20" fill="#7A5010" opacity="0.6"/>
    <!-- Wings -->
    <rect x="14" y="46" width="18" height="22" fill="#C8922A" opacity="0.5"/>
    <rect x="68" y="46" width="18" height="22" fill="#C8922A" opacity="0.5"/>
    <!-- Eyes -->
    <rect x="38" y="48" width="7" height="7"  fill="#FF4040"/>
    <rect x="55" y="48" width="7" height="7"  fill="#FF4040"/>
    <!-- Name -->
    <rect x="8"  y="112" width="84" height="22" fill="#1A0C04"/>
    <text x="50" y="127" font-family="'Courier New', monospace" font-size="10" font-weight="900"
          letter-spacing="1" fill="#F5D060" text-anchor="middle" filter="url(#packGlow)">PREMIUM PACK</text>
    <rect x="8" y="136" width="84" height="10" fill="#0A0804" opacity="0.5"/>
    <text x="50" y="144" font-family="'Courier New', monospace" font-size="7"
          fill="#C8922A" text-anchor="middle">5 KARTEN · GARANTIERT RARE+</text>
    <rect x="0" y="0" width="100" height="150" rx="6" fill="url(#packShine)"/>
    <polygon points="86,2 100,2 100,16" fill="#F5D060" opacity="0.2"/>
  </g>

  <!-- BOOSTER BOX -->
  <g transform="translate(370,15)" filter="url(#packShadow)">
    <!-- Box perspective (3D pixel) -->
    <!-- Top face -->
    <polygon points="20,0 200,0 220,20 40,20" fill="#3A1808" stroke="#C8922A" stroke-width="1.5"/>
    <!-- Front face -->
    <rect x="20" y="20" width="180" height="130" rx="4" fill="url(#boosterBoxGrad)" stroke="#C8922A" stroke-width="1.5"/>
    <!-- Side face (right perspective) -->
    <polygon points="200,0 220,20 220,150 200,150" fill="#1A0804" stroke="#9A6810" stroke-width="1"/>
    <!-- Top label -->
    <text x="120" y="14" font-family="'Courier New', monospace" font-size="9" font-weight="700"
          fill="#C8922A" text-anchor="middle" letter-spacing="3">POCKET COLLECTOR</text>
    <!-- Front art -->
    <rect x="28" y="28" width="164" height="80" rx="3" fill="#0D0804" opacity="0.8"/>
    <!-- Box art pixel (large logo style) -->
    <rect x="60" y="34" width="80" height="6"  fill="#C8922A" opacity="0.7"/>
    <rect x="48" y="40" width="24" height="40" fill="#C8922A" opacity="0.5"/>
    <rect x="72" y="40" width="56" height="40" fill="#F5D060" opacity="0.4"/>
    <rect x="128" y="40" width="24" height="40" fill="#C8922A" opacity="0.5"/>
    <!-- Pixel leaf symbol center of box -->
    <rect x="92" y="46" width="6" height="6"  fill="#6DBF4A"/>
    <rect x="98" y="46" width="6" height="6"  fill="#6DBF4A"/>
    <rect x="86" y="52" width="6" height="6"  fill="#4A9B30"/>
    <rect x="92" y="52" width="6" height="6"  fill="#A8E060"/>
    <rect x="98" y="52" width="6" height="6"  fill="#6DBF4A"/>
    <rect x="104" y="52" width="6" height="6" fill="#4A9B30"/>
    <rect x="86" y="58" width="6" height="6"  fill="#4A9B30"/>
    <rect x="92" y="58" width="6" height="6"  fill="#A8E060"/>
    <rect x="98" y="58" width="6" height="6"  fill="#4A9B30"/>
    <rect x="92" y="64" width="6" height="6"  fill="#2D6B1A"/>
    <rect x="92" y="70" width="6" height="6"  fill="#2D6B1A"/>
    <!-- Bottom label on box -->
    <rect x="28" y="112" width="164" height="34" fill="#1A0C04"/>
    <text x="110" y="127" font-family="'Courier New', monospace" font-size="11" font-weight="900"
          fill="#F5D060" text-anchor="middle" letter-spacing="1" filter="url(#packGlow)">BOOSTER BOX</text>
    <text x="110" y="140" font-family="'Courier New', monospace" font-size="8"
          fill="#C8922A" text-anchor="middle">24 PACKS · PREMIUM</text>
    <!-- Box shine -->
    <polygon points="20,0 200,0 220,20 40,20" fill="url(#packShine)" opacity="0.5"/>
  </g>
</svg>
