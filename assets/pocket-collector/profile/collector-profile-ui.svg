<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" width="460" height="280">
  <defs>
    <linearGradient id="profileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1208"/><stop offset="100%" stop-color="#0D0A04"/>
    </linearGradient>
    <linearGradient id="xpBarFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6DBF4A"/><stop offset="100%" stop-color="#F5D060"/>
    </linearGradient>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D4A1A"/><stop offset="100%" stop-color="#1A2810"/>
    </linearGradient>
    <filter id="profileGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Card body -->
  <rect x="0" y="0" width="460" height="280" rx="12" fill="url(#profileBg)" stroke="#C8922A" stroke-width="2"/>
  <rect x="2" y="2" width="456" height="276" rx="11" fill="none" stroke="#5A4030" stroke-width="0.5" opacity="0.5"/>

  <!-- Top header -->
  <rect x="0" y="0" width="460" height="56" rx="12" fill="#241808"/>
  <rect x="0" y="44" width="460" height="12" fill="#241808"/>
  <line x1="12" y1="56" x2="448" y2="56" stroke="#C8922A" stroke-width="1" opacity="0.5"/>
  <text x="230" y="34" font-family="'Courier New', monospace" font-size="13" font-weight="700"
        letter-spacing="3" fill="#F5D060" text-anchor="middle" filter="url(#profileGlow)">SAMMLER PROFIL</text>
  <!-- Corner ornaments -->
  <rect x="8"  y="8"  width="6" height="6" fill="#F5D060" opacity="0.5"/>
  <rect x="446" y="8"  width="6" height="6" fill="#F5D060" opacity="0.5"/>

  <!-- AVATAR section -->
  <!-- Avatar frame (pixel art portrait) -->
  <rect x="18" y="70" width="80" height="80" rx="6" fill="url(#avatarBg)" stroke="#C8922A" stroke-width="2" filter="url(#profileGlow)"/>
  <!-- Pixel art character face -->
  <!-- Hair -->
  <rect x="26" y="76" width="64" height="10" fill="#3A2010"/>
  <rect x="22" y="82" width="10" height="20" fill="#3A2010"/>
  <rect x="84" y="82" width="10" height="20" fill="#3A2010"/>
  <!-- Skin face -->
  <rect x="26" y="86" width="64" height="36" fill="#E8B880" rx="2"/>
  <!-- Eyes (with glasses) -->
  <rect x="32" y="96" width="14" height="10" rx="2" fill="none" stroke="#3A2010" stroke-width="2"/>
  <rect x="50" y="96" width="14" height="10" rx="2" fill="none" stroke="#3A2010" stroke-width="2"/>
  <rect x="36" y="98" width="6"  height="6"  fill="#1A4080"/>
  <rect x="54" y="98" width="6"  height="6"  fill="#1A4080"/>
  <rect x="46" y="98" width="4"  height="4"  fill="#3A2010"/><!-- nose bridge -->
  <!-- Mouth smile -->
  <rect x="36" y="110" width="4" height="4"  fill="#C87040" opacity="0.7"/>
  <rect x="40" y="112" width="6" height="4"  fill="#C87040" opacity="0.7"/>
  <rect x="46" y="114" width="6" height="4"  fill="#C87040" opacity="0.7"/>
  <rect x="52" y="112" width="4" height="4"  fill="#C87040" opacity="0.7"/>
  <!-- Collar/shirt -->
  <rect x="30" y="122" width="56" height="20" fill="#3A5A88"/>
  <rect x="44" y="122" width="4"  height="8"  fill="#1A2A48"/>
  <rect x="48" y="122" width="4"  height="8"  fill="#1A2A48"/>
  <!-- Hair tuft pixel -->
  <rect x="44" y="72" width="6"  height="8"  fill="#5C3A10"/>
  <rect x="52" y="70" width="6"  height="6"  fill="#5C3A10"/>

  <!-- Profile info -->
  <text x="114" y="86" font-family="'Courier New', monospace" font-size="14" font-weight="900"
        fill="#F5D060" filter="url(#profileGlow)">ARCHIVIST I</text>
  <text x="114" y="102" font-family="'Courier New', monospace" font-size="9" letter-spacing="1"
        fill="#C8922A" opacity="0.8">PASSIONIERTER SAMMLER</text>

  <!-- Level badge -->
  <rect x="114" y="110" width="60" height="24" rx="4" fill="#1A1208" stroke="#C8922A" stroke-width="1.5"/>
  <text x="144" y="126" font-family="'Courier New', monospace" font-size="11" font-weight="700"
        fill="#F5D060" text-anchor="middle">LVL 37</text>

  <!-- XP bar -->
  <rect x="180" y="114" width="150" height="16" rx="4" fill="#0A0804" stroke="#5A4030" stroke-width="1"/>
  <rect x="182" y="116" width="90"  height="12" rx="3" fill="url(#xpBarFill)"/>
  <rect x="182" y="116" width="24"  height="6"  rx="2" fill="#FFFFFF" opacity="0.12"/>
  <text x="336" y="126" font-family="'Courier New', monospace" font-size="7" fill="#C8922A" opacity="0.8">4200/7500</text>

  <!-- Divider -->
  <line x1="18" y1="162" x2="442" y2="162" stroke="#5A4030" stroke-width="1" opacity="0.5"/>

  <!-- STATS section -->
  <!-- Donut chart placeholder (right side) -->
  <g transform="translate(330, 175)">
    <!-- Outer ring segments (pixel art donut) -->
    <circle cx="55" cy="50" r="44" fill="none" stroke="#3A6B1A" stroke-width="16" stroke-dasharray="138,86" stroke-dashoffset="0"/>
    <circle cx="55" cy="50" r="44" fill="none" stroke="#3A5A88" stroke-width="16" stroke-dasharray="89,135" stroke-dashoffset="-138"/>
    <circle cx="55" cy="50" r="44" fill="none" stroke="#9A6810" stroke-width="16" stroke-dasharray="41,183" stroke-dashoffset="-227"/>
    <circle cx="55" cy="50" r="44" fill="none" stroke="#8A2020" stroke-width="16" stroke-dasharray="16,208" stroke-dashoffset="-268"/>
    <!-- Center -->
    <circle cx="55" cy="50" r="28" fill="#0D0A04"/>
    <text x="55" y="46" font-family="'Courier New', monospace" font-size="9" fill="#C8922A" text-anchor="middle">672</text>
    <text x="55" y="58" font-family="'Courier New', monospace" font-size="7" fill="#8A6820" text-anchor="middle">KARTEN</text>
    <!-- Legend dots -->
    <rect x="0" y="104" width="8" height="8" fill="#3A6B1A"/>
    <text x="12" y="112" font-family="'Courier New', monospace" font-size="7" fill="#6DBF4A">53% Kanto</text>
    <rect x="0" y="116" width="8" height="8" fill="#3A5A88"/>
    <text x="12" y="124" font-family="'Courier New', monospace" font-size="7" fill="#7BBFEE">32% Johto</text>
    <rect x="0" y="128" width="8" height="8" fill="#9A6810"/>
    <text x="12" y="136" font-family="'Courier New', monospace" font-size="7" fill="#C8922A">12% Hoenn</text>
    <rect x="0" y="140" width="8" height="8" fill="#8A2020"/>
    <text x="12" y="148" font-family="'Courier New', monospace" font-size="7" fill="#E07070">3% Sonstige</text>
  </g>

  <!-- Stats list (left side) -->
  <g transform="translate(18, 172)">
    <!-- Sammlung stat -->
    <text x="0" y="18" font-family="'Courier New', monospace" font-size="9" fill="#8A7A60" letter-spacing="1">SAMMLUNG</text>
    <rect x="96" y="6"  width="160" height="10" rx="3" fill="#0A0804" stroke="#3A2808" stroke-width="1"/>
    <rect x="98" y="8"  width="104" height="6"  rx="2" fill="#C8922A" opacity="0.7"/>
    <text x="262" y="17" font-family="'Courier New', monospace" font-size="9" fill="#F5D060">672 / 1024</text>

    <!-- Binder stat -->
    <text x="0" y="40" font-family="'Courier New', monospace" font-size="9" fill="#8A7A60" letter-spacing="1">BINDER</text>
    <rect x="96" y="28" width="160" height="10" rx="3" fill="#0A0804" stroke="#3A2808" stroke-width="1"/>
    <rect x="98" y="30" width="96"  height="6"  rx="2" fill="#5A8AB8" opacity="0.7"/>
    <text x="262" y="39" font-family="'Courier New', monospace" font-size="9" fill="#7BBFEE">12 / 20</text>

    <!-- Erfolge stat -->
    <text x="0" y="62" font-family="'Courier New', monospace" font-size="9" fill="#8A7A60" letter-spacing="1">ERFOLGE</text>
    <rect x="96" y="50" width="160" height="10" rx="3" fill="#0A0804" stroke="#3A2808" stroke-width="1"/>
    <rect x="98" y="52" width="64"  height="6"  rx="2" fill="#6DBF4A" opacity="0.7"/>
    <text x="262" y="61" font-family="'Courier New', monospace" font-size="9" fill="#A8E060">48 / 120</text>

    <!-- LIEBLINGS-TYPEN -->
    <text x="0" y="88" font-family="'Courier New', monospace" font-size="9" fill="#8A7A60" letter-spacing="1">LIEBLINGSTYPEN</text>
    <!-- Type icons (pixel circles with emoji-style) -->
    <!-- Feuer -->
    <circle cx="14"  cy="106" r="10" fill="#C83020" stroke="#E05040" stroke-width="1.5"/>
    <rect x="9"  y="101" width="4" height="8" fill="#FF8020" opacity="0.8"/>
    <rect x="14" y="99"  width="4" height="6" fill="#FFB030" opacity="0.8"/>
    <rect x="19" y="101" width="4" height="8" fill="#FF8020" opacity="0.8"/>
    <!-- Wasser -->
    <circle cx="38"  cy="106" r="10" fill="#1A60A0" stroke="#3A80C0" stroke-width="1.5"/>
    <rect x="34" y="100" width="8" height="12" rx="4" fill="#60B8F0" opacity="0.8"/>
    <!-- Blitz -->
    <circle cx="62"  cy="106" r="10" fill="#8A7010" stroke="#C8A820" stroke-width="1.5"/>
    <polygon points="66,98 62,106 66,106 60,114 64,106 60,106" fill="#FFD700" opacity="0.9"/>
    <!-- Pflanze -->
    <circle cx="86"  cy="106" r="10" fill="#2D6B1A" stroke="#4A9B30" stroke-width="1.5"/>
    <rect x="82" y="103" width="8" height="6"  fill="#6DBF4A" opacity="0.8"/>
    <rect x="84" y="101" width="4" height="10" fill="#4A9B30" opacity="0.8"/>
    <!-- Geist -->
    <circle cx="110" cy="106" r="10" fill="#4A1870" stroke="#8A40B0" stroke-width="1.5"/>
    <rect x="105" y="100" width="10" height="10" rx="5" fill="#C080FF" opacity="0.7"/>
    <rect x="105" y="108" width="4"  height="4"  fill="#C080FF" opacity="0.7"/>
    <rect x="111" y="108" width="4"  height="4"  fill="#C080FF" opacity="0.7"/>
    <!-- Normal -->
    <circle cx="134" cy="106" r="10" fill="#3A3828" stroke="#6A6850" stroke-width="1.5"/>
    <rect x="130" y="102" width="8" height="8"  rx="2" fill="#8A8870" opacity="0.7"/>
  </g>
</svg>
