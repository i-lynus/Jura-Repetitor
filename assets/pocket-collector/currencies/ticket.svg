<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" width="100" height="60">
  <defs>
    <linearGradient id="ticketBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#3A2808"/>
      <stop offset="100%" stop-color="#1A1004"/>
    </linearGradient>
    <linearGradient id="ticketEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#C8922A"/>
      <stop offset="100%" stop-color="#7A5010"/>
    </linearGradient>
    <filter id="ticketGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Ticket body -->
  <rect x="3" y="6" width="94" height="48" rx="6" fill="url(#ticketBg)" stroke="url(#ticketEdge)" stroke-width="2" filter="url(#ticketGlow)"/>

  <!-- Perforation line -->
  <line x1="68" y1="6" x2="68" y2="54" stroke="#C8922A" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <!-- Half-circle cuts -->
  <path d="M68,6 A5,5 0 0,1 68,16" fill="#00000000" stroke="none"/>
  <circle cx="68" cy="6"  r="5" fill="black" opacity="0"/>
  <circle cx="68" cy="54" r="5" fill="black" opacity="0"/>

  <!-- Left main area -->
  <!-- Star -->
  <polygon points="16,20 18,26 24,26 19,30 21,36 16,32 11,36 13,30 8,26 14,26"
           fill="#F5D060" filter="url(#ticketGlow)" opacity="0.9"/>
  <!-- Text lines -->
  <rect x="30" y="16" width="32" height="4" rx="1" fill="#C8922A" opacity="0.8"/>
  <rect x="30" y="24" width="24" height="3" rx="1" fill="#9A6810" opacity="0.6"/>
  <rect x="30" y="31" width="28" height="3" rx="1" fill="#9A6810" opacity="0.6"/>

  <!-- Right stub area -->
  <rect x="72" y="10" width="20" height="40" rx="3" fill="#241804" opacity="0.6"/>
  <!-- Stub number/barcode lines -->
  <rect x="75" y="14" width="3" height="24" fill="#C8922A" opacity="0.5"/>
  <rect x="79" y="14" width="2" height="24" fill="#C8922A" opacity="0.3"/>
  <rect x="82" y="14" width="4" height="24" fill="#C8922A" opacity="0.5"/>
  <rect x="87" y="14" width="2" height="24" fill="#C8922A" opacity="0.3"/>
  <!-- Stub label -->
  <text x="79" y="44" font-family="'Courier New', monospace" font-size="6"
        fill="#C8922A" text-anchor="middle" opacity="0.7">STUB</text>

  <!-- Corner ornaments -->
  <rect x="5"  y="8"  width="5" height="5" fill="#F5D060" opacity="0.4"/>
  <rect x="90" y="8"  width="5" height="5" fill="#F5D060" opacity="0.4"/>
  <rect x="5"  y="47" width="5" height="5" fill="#F5D060" opacity="0.4"/>
  <rect x="90" y="47" width="5" height="5" fill="#F5D060" opacity="0.4"/>
</svg>
