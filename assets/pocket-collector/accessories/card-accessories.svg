<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" width="420" height="180">
  <defs>
    <linearGradient id="accGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5D060"/><stop offset="100%" stop-color="#9A6810"/>
    </linearGradient>
    <linearGradient id="sleeveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D6B1A"/><stop offset="100%" stop-color="#1A3010"/>
    </linearGradient>
    <linearGradient id="toploaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A0C8E0" stop-opacity="0.4"/><stop offset="100%" stop-color="#5A8AB8" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="matGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A2A5A"/><stop offset="100%" stop-color="#1A1430"/>
    </linearGradient>
    <filter id="accGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="accShadow">
      <feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <text x="10" y="18" font-family="'Courier New', monospace" font-size="10" letter-spacing="3" fill="#C8922A" opacity="0.8">ZUBEHÖR</text>
  <line x1="80" y1="14" x2="410" y2="14" stroke="#C8922A" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>

  <!-- KARTENHÜLLEN (card sleeves) -->
  <g transform="translate(20, 32)" filter="url(#accShadow)">
    <!-- Stack of sleeves -->
    <rect x="14" y="8"  width="64" height="92" rx="4" fill="#1A2A48" stroke="#3A5A88" stroke-width="1.5"/>
    <rect x="8"  y="4"  width="64" height="92" rx="4" fill="#2A1818" stroke="#8A2020" stroke-width="1.5"/>
    <rect x="2"  y="0"  width="64" height="92" rx="4" fill="url(#sleeveGrad)" stroke="#4A9B30" stroke-width="1.5"/>
    <!-- Sleeve opening top -->
    <rect x="2"  y="0"  width="64" height="10" rx="4" fill="#4A9B30" opacity="0.5"/>
    <!-- Card peeking inside -->
    <rect x="8"  y="6"  width="52" height="80" rx="3" fill="#3A2410" opacity="0.6"/>
    <!-- Plastic shine -->
    <rect x="10" y="10" width="14" height="60" rx="2" fill="#FFFFFF" opacity="0.12"/>
    <rect x="6"  y="14" width="4"  height="50" fill="#A8E060" opacity="0.2"/>
    <!-- Back design pixel -->
    <rect x="28" y="36" width="6" height="6" fill="#6DBF4A" opacity="0.5"/>
    <rect x="34" y="36" width="6" height="6" fill="#6DBF4A" opacity="0.5"/>
    <rect x="26" y="42" width="6" height="6" fill="#A8E060" opacity="0.4"/>
    <rect x="32" y="42" width="6" height="6" fill="#4A9B30" opacity="0.5"/>
    <text x="34" y="118" font-family="'Courier New', monospace" font-size="9" font-weight="700" fill="#6DBF4A" text-anchor="middle">KARTENHÜLLEN</text>
  </g>

  <!-- TOPLOADER (rigid clear holder) -->
  <g transform="translate(160, 32)" filter="url(#accShadow)">
    <!-- Rigid frame -->
    <rect x="6" y="0" width="68" height="96" rx="3" fill="url(#toploaderGrad)" stroke="#7BBFEE" stroke-width="2.5"/>
    <!-- Inner card -->
    <rect x="14" y="8" width="52" height="80" rx="2" fill="#1A1208" stroke="#C8922A" stroke-width="1"/>
    <!-- Card mini art -->
    <rect x="18" y="12" width="44" height="38" rx="2" fill="#3A2410"/>
    <polygon points="40,18 50,28 40,44 30,28" fill="#C8922A" opacity="0.6"/>
    <rect x="18" y="54" width="44" height="8" rx="1" fill="#241808"/>
    <rect x="18" y="64" width="44" height="20" rx="1" fill="#120E04"/>
    <rect x="22" y="68" width="24" height="3" fill="#C8922A" opacity="0.5"/>
    <rect x="22" y="74" width="32" height="3" fill="#9A6810" opacity="0.4"/>
    <!-- Top loading slot -->
    <rect x="20" y="-2" width="40" height="6" rx="2" fill="#A0C8E0" opacity="0.5"/>
    <!-- Hard plastic shine -->
    <rect x="10" y="4" width="8" height="86" fill="#FFFFFF" opacity="0.15"/>
    <rect x="62" y="8" width="4" height="78" fill="#FFFFFF" opacity="0.1"/>
    <text x="40" y="118" font-family="'Courier New', monospace" font-size="9" font-weight="700" fill="#7BBFEE" text-anchor="middle">TOPLOADER</text>
  </g>

  <!-- SPIELMATTE (playmat) -->
  <g transform="translate(264, 36)" filter="url(#accShadow)">
    <!-- Mat (rolled out, perspective) -->
    <polygon points="0,30 130,30 138,88 -8,88" fill="url(#matGrad)" stroke="#8060C0" stroke-width="2"/>
    <!-- Mat border design -->
    <polygon points="8,36 122,36 128,82 2,82" fill="none" stroke="#A060FF" stroke-width="1" opacity="0.5"/>
    <!-- Card zones outlined on mat -->
    <rect x="14" y="44" width="22" height="30" rx="2" fill="none" stroke="#8060C0" stroke-width="1" opacity="0.6" transform="skewX(-4)"/>
    <rect x="44" y="44" width="22" height="30" rx="2" fill="none" stroke="#C080FF" stroke-width="1.5" opacity="0.8" transform="skewX(-4)"/>
    <rect x="74" y="44" width="22" height="30" rx="2" fill="none" stroke="#8060C0" stroke-width="1" opacity="0.6" transform="skewX(-4)"/>
    <!-- Center emblem -->
    <circle cx="64" cy="58" r="10" fill="#2A1848" opacity="0.6"/>
    <polygon points="64,50 70,58 64,66 58,58" fill="#C080FF" opacity="0.7" filter="url(#accGlow)"/>
    <!-- Mat curl at top -->
    <polygon points="0,30 130,30 124,24 6,24" fill="#4A3A7A" opacity="0.7"/>
    <!-- Stars on mat -->
    <circle cx="24" cy="34" r="1.5" fill="#C080FF" opacity="0.6"/>
    <circle cx="104" cy="36" r="1.5" fill="#A060FF" opacity="0.6"/>
    <text x="64" y="108" font-family="'Courier New', monospace" font-size="9" font-weight="700" fill="#C080FF" text-anchor="middle">SPIELMATTE</text>
  </g>

  <!-- Quality/rarity tags -->
  <g transform="translate(20, 158)">
    <rect x="0" y="0" width="120" height="16" rx="4" fill="#1A1208" stroke="#4A9B30" stroke-width="1"/>
    <text x="60" y="12" font-family="'Courier New', monospace" font-size="7" fill="#6DBF4A" text-anchor="middle">SCHÜTZT KARTEN</text>
  </g>
  <g transform="translate(160, 158)">
    <rect x="0" y="0" width="100" height="16" rx="4" fill="#1A1208" stroke="#7BBFEE" stroke-width="1"/>
    <text x="50" y="12" font-family="'Courier New', monospace" font-size="7" fill="#7BBFEE" text-anchor="middle">PREMIUM SCHUTZ</text>
  </g>
  <g transform="translate(280, 158)">
    <rect x="0" y="0" width="100" height="16" rx="4" fill="#1A1208" stroke="#A060FF" stroke-width="1"/>
    <text x="50" y="12" font-family="'Courier New', monospace" font-size="7" fill="#C080FF" text-anchor="middle">DEKO &amp; STIL</text>
  </g>
</svg>
