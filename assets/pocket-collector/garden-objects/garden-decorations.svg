<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280">
  <defs>
    <filter id="deco-glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="stoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A8880"/><stop offset="100%" stop-color="#4A4840"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A8ABF"/><stop offset="100%" stop-color="#1A4A7A"/>
    </linearGradient>
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C0A0FF"/><stop offset="50%" stop-color="#8060D0"/><stop offset="100%" stop-color="#401880"/>
    </linearGradient>
  </defs>

  <!-- === PATHS & WEGE === -->
  <text x="10" y="18" font-family="'Courier New', monospace" font-size="9" fill="#C8922A" letter-spacing="2" opacity="0.8">WEGE &amp; BÖDEN</text>

  <!-- Stone path tile -->
  <g transform="translate(10, 28)">
    <rect x="0"  y="0"  width="28" height="20" rx="3" fill="url(#stoneGrad)" stroke="#6A6860" stroke-width="1"/>
    <rect x="2"  y="2"  width="8"  height="6"  fill="#9A9890" opacity="0.5"/>
    <rect x="0"  y="22" width="28" height="20" rx="3" fill="#5A5850" stroke="#6A6860" stroke-width="1"/>
    <rect x="2"  y="24" width="12" height="5"  fill="#6A6860" opacity="0.5"/>
    <text x="14" y="58" font-family="'Courier New', monospace" font-size="7" fill="#8A8880" text-anchor="middle">STEIN</text>
  </g>

  <!-- Grass tile -->
  <g transform="translate(54, 28)">
    <rect x="0" y="0" width="28" height="20" rx="2" fill="#2A4A18" stroke="#3A6A20" stroke-width="1"/>
    <!-- Grass tufts -->
    <rect x="4"  y="-2" width="3" height="7" fill="#5DB840"/>
    <rect x="10" y="-4" width="3" height="8" fill="#4A9B30"/>
    <rect x="16" y="-2" width="3" height="6" fill="#5DB840"/>
    <rect x="22" y="-3" width="3" height="7" fill="#6DBF4A"/>
    <rect x="0"  y="22" width="28" height="20" rx="2" fill="#1A3010" stroke="#2A4A18" stroke-width="1"/>
    <rect x="6"  y="20" width="3"  height="7" fill="#4A9B30"/>
    <rect x="14" y="19" width="3"  height="8" fill="#5DB840"/>
    <rect x="22" y="20" width="3"  height="7" fill="#4A9B30"/>
    <text x="14" y="58" font-family="'Courier New', monospace" font-size="7" fill="#5DB840" text-anchor="middle">GRAS</text>
  </g>

  <!-- Dirt path -->
  <g transform="translate(98, 28)">
    <rect x="0" y="0" width="28" height="20" rx="2" fill="#5C3A1E" stroke="#7A5030" stroke-width="1"/>
    <rect x="4"  y="4"  width="5" height="5" fill="#7A5030" opacity="0.5"/>
    <rect x="14" y="8"  width="4" height="4" fill="#9A6840" opacity="0.4"/>
    <rect x="20" y="3"  width="5" height="5" fill="#7A5030" opacity="0.5"/>
    <rect x="0"  y="22" width="28" height="20" rx="2" fill="#3A2010" stroke="#5C3A1E" stroke-width="1"/>
    <text x="14" y="58" font-family="'Courier New', monospace" font-size="7" fill="#9A6840" text-anchor="middle">ERDE</text>
  </g>

  <!-- === PLANTS & TREES === -->
  <text x="170" y="18" font-family="'Courier New', monospace" font-size="9" fill="#C8922A" letter-spacing="2" opacity="0.8">PFLANZEN &amp; BÄUME</text>

  <!-- Small flower -->
  <g transform="translate(170, 24)">
    <rect x="11" y="18" width="5"  height="20" fill="#3A6B20"/>
    <rect x="6"  y="8"  width="5"  height="5"  fill="#E84040"/>
    <rect x="16" y="8"  width="5"  height="5"  fill="#E84040"/>
    <rect x="6"  y="18" width="5"  height="5"  fill="#E84040"/>
    <rect x="16" y="18" width="5"  height="5"  fill="#E84040"/>
    <rect x="11" y="4"  width="5"  height="5"  fill="#FFD700"/>
    <rect x="11" y="24" width="5"  height="5"  fill="#FFD700"/>
    <rect x="11" y="14" width="5"  height="5"  fill="#FF9B40"/>
    <text x="14" y="56" font-family="'Courier New', monospace" font-size="7" fill="#E84040" text-anchor="middle">BLUME</text>
  </g>

  <!-- Bush -->
  <g transform="translate(208, 32)">
    <rect x="0"  y="16" width="40" height="20" fill="#2D6B1A"/>
    <rect x="6"  y="8"  width="28" height="14" fill="#4A9B30"/>
    <rect x="12" y="2"  width="16" height="12" fill="#5DB840"/>
    <rect x="4"  y="18" width="6"  height="6"  fill="#E84080" opacity="0.9"/>
    <rect x="20" y="14" width="6"  height="6"  fill="#FF9B40" opacity="0.9"/>
    <rect x="30" y="20" width="6"  height="6"  fill="#A040E8" opacity="0.9"/>
    <text x="20" y="52" font-family="'Courier New', monospace" font-size="7" fill="#5DB840" text-anchor="middle">BUSCH</text>
  </g>

  <!-- Mushroom -->
  <g transform="translate(264, 28)">
    <rect x="12" y="28" width="10" height="18" fill="#C8A870"/>
    <rect x="14" y="30" width="5"  height="14" fill="#E0C898" opacity="0.5"/>
    <rect x="2"  y="10" width="30" height="20" rx="14" fill="#E84040"/>
    <rect x="8"  y="8"  width="18" height="8"  rx="9"  fill="#E84040"/>
    <rect x="8"  y="14" width="6"  height="6"  fill="#FFFFFF" opacity="0.7"/>
    <rect x="20" y="16" width="5"  height="5"  fill="#FFFFFF" opacity="0.7"/>
    <rect x="14" y="11" width="4"  height="4"  fill="#FFFFFF" opacity="0.6"/>
    <text x="17" y="60" font-family="'Courier New', monospace" font-size="7" fill="#E84040" text-anchor="middle">PILZ</text>
  </g>

  <!-- Tall pine tree -->
  <g transform="translate(310, 16)">
    <rect x="14" y="54" width="10" height="20" fill="#5C3A1E"/>
    <rect x="16" y="54" width="4"  height="20" fill="#7A5030"/>
    <rect x="4"  y="40" width="30" height="18" fill="#2D6B1A"/>
    <rect x="8"  y="26" width="22" height="18" fill="#4A9B30"/>
    <rect x="12" y="14" width="14" height="16" fill="#5DB840"/>
    <rect x="15" y="6"  width="8"  height="12" fill="#6DBF4A"/>
    <rect x="6"  y="42" width="8"  height="6"  fill="#3A8A24" opacity="0.4"/>
    <text x="19" y="86" font-family="'Courier New', monospace" font-size="7" fill="#4A9B30" text-anchor="middle">KIEFER</text>
  </g>

  <!-- Cherry blossom tree -->
  <g transform="translate(358, 20)">
    <rect x="16" y="52" width="8"  height="22" fill="#5C3A1E"/>
    <rect x="18" y="52" width="3"  height="22" fill="#7A5030"/>
    <!-- Branches -->
    <line x1="20" y1="56" x2="8"  y2="44" stroke="#5C3A1E" stroke-width="4"/>
    <line x1="20" y1="56" x2="32" y2="44" stroke="#5C3A1E" stroke-width="4"/>
    <!-- Blossom clouds -->
    <circle cx="20" cy="30" r="20" fill="#FFB8C8" opacity="0.9"/>
    <circle cx="8"  cy="36" r="14" fill="#FF90A8" opacity="0.8"/>
    <circle cx="32" cy="36" r="14" fill="#FFB8C8" opacity="0.8"/>
    <circle cx="12" cy="24" r="12" fill="#FFC8D8" opacity="0.7"/>
    <circle cx="28" cy="24" r="12" fill="#FF90A8" opacity="0.7"/>
    <!-- Flowers detail -->
    <rect x="14" y="22" width="6" height="6" fill="#FFE8F0" opacity="0.6"/>
    <rect x="24" y="28" width="6" height="6" fill="#FFE8F0" opacity="0.6"/>
    <text x="20" y="86" font-family="'Courier New', monospace" font-size="7" fill="#FFB8C8" text-anchor="middle">KIRSCHE</text>
  </g>

  <!-- === DECORATIONS === -->
  <text x="430" y="18" font-family="'Courier New', monospace" font-size="9" fill="#C8922A" letter-spacing="2" opacity="0.8">DEKORATIONEN</text>

  <!-- Bench -->
  <g transform="translate(430, 60)">
    <!-- Seat -->
    <rect x="0"  y="20" width="50" height="6" fill="#8B6030" stroke="#C8922A" stroke-width="0.5"/>
    <rect x="4"  y="22" width="42" height="3" fill="#A87040" opacity="0.4"/>
    <!-- Back -->
    <rect x="0"  y="8"  width="50" height="5" fill="#8B6030"/>
    <rect x="0"  y="14" width="50" height="5" fill="#7A5020"/>
    <!-- Legs -->
    <rect x="4"  y="26" width="5" height="16" fill="#5C3A1E"/>
    <rect x="20" y="26" width="5" height="16" fill="#5C3A1E"/>
    <rect x="40" y="26" width="5" height="16" fill="#5C3A1E"/>
    <!-- Feet -->
    <rect x="2"  y="40" width="9"  height="4"  fill="#3A2010"/>
    <rect x="18" y="40" width="9"  height="4"  fill="#3A2010"/>
    <rect x="38" y="40" width="9"  height="4"  fill="#3A2010"/>
    <text x="25" y="58" font-family="'Courier New', monospace" font-size="7" fill="#C8922A" text-anchor="middle">BANK</text>
  </g>

  <!-- Lantern (standalone) -->
  <g transform="translate(502, 30)" filter="url(#deco-glow)">
    <rect x="11" y="46" width="6"  height="30" fill="#8B6914"/>
    <rect x="14" y="46" width="2"  height="30" fill="#A87010" opacity="0.5"/>
    <rect x="6"  y="28" width="16" height="20" rx="2" fill="#C8922A"/>
    <rect x="9"  y="30" width="10" height="14" fill="#FFD700" opacity="0.9"/>
    <circle cx="14" cy="37" r="10" fill="#FFD700" opacity="0.10"/>
    <rect x="7"  y="24" width="14" height="6" rx="2" fill="#A87010"/>
    <rect x="11" y="18" width="6"  height="8"  fill="#C8922A"/>
    <!-- Light rays pixel -->
    <rect x="4"  y="36" width="4"  height="2" fill="#FFD700" opacity="0.4"/>
    <rect x="20" y="36" width="4"  height="2" fill="#FFD700" opacity="0.4"/>
    <rect x="12" y="18" width="4"  height="4" fill="#FFD700" opacity="0.3"/>
    <!-- Base -->
    <rect x="8"  y="76" width="12" height="4" rx="2" fill="#5C3A10"/>
    <rect x="4"  y="78" width="20" height="3" rx="1" fill="#3A2008"/>
    <text x="14" y="96" font-family="'Courier New', monospace" font-size="7" fill="#F5D060" text-anchor="middle">LATERNE</text>
  </g>

  <!-- Fountain -->
  <g transform="translate(542, 30)">
    <!-- Base -->
    <rect x="0"  y="80" width="64" height="8"  rx="4" fill="#5A5850"/>
    <rect x="4"  y="64" width="56" height="20" rx="4" fill="#4A4840"/>
    <rect x="8"  y="66" width="48" height="14" rx="2" fill="#3A8ABF" opacity="0.7"/>
    <!-- Water surface -->
    <rect x="10" y="66" width="44" height="4"  fill="#5AAAD0" opacity="0.6"/>
    <!-- Pillar -->
    <rect x="28" y="32" width="8"  height="34" fill="#5A5850"/>
    <rect x="30" y="34" width="3"  height="28" fill="#7A7870" opacity="0.5"/>
    <!-- Top basin -->
    <rect x="16" y="24" width="32" height="10" rx="4" fill="#4A4840"/>
    <rect x="20" y="26" width="24" height="6"  rx="2" fill="#3A8ABF" opacity="0.6"/>
    <!-- Top ornament -->
    <rect x="29" y="14" width="6"  height="12" fill="#7A7870"/>
    <rect x="26" y="10" width="12" height="6"  rx="3" fill="#8A8880"/>
    <!-- Water drops pixel -->
    <rect x="14" y="32" width="4" height="8" fill="#7BBFEE" opacity="0.6"/>
    <rect x="46" y="34" width="4" height="6" fill="#7BBFEE" opacity="0.5"/>
    <rect x="30" y="22" width="4" height="6" fill="#7BBFEE" opacity="0.5"/>
    <!-- Sparkles -->
    <rect x="16" y="70" width="4" height="4" fill="#A8D8FF" opacity="0.7"/>
    <rect x="28" y="68" width="4" height="4" fill="#A8D8FF" opacity="0.5"/>
    <rect x="42" y="72" width="4" height="4" fill="#A8D8FF" opacity="0.7"/>
    <text x="32" y="100" font-family="'Courier New', monospace" font-size="7" fill="#7BBFEE" text-anchor="middle">BRUNNEN</text>
  </g>

  <!-- === SPECIAL OBJECTS === -->
  <text x="10" y="168" font-family="'Courier New', monospace" font-size="9" fill="#C8922A" letter-spacing="2" opacity="0.8">SPEZIAL OBJEKTE</text>

  <!-- Archive Stone / Obelisk -->
  <g transform="translate(10, 180)">
    <rect x="10" y="0"  width="24" height="60" fill="#3A3A4A" stroke="#6A6A8A" stroke-width="1"/>
    <polygon points="22,0 34,0 22,-14" fill="#4A4A5A" stroke="#6A6A8A" stroke-width="1"/>
    <!-- Rune lines -->
    <rect x="14" y="8"  width="16" height="2" fill="#8080C0" opacity="0.7"/>
    <rect x="14" y="14" width="12" height="2" fill="#8080C0" opacity="0.5"/>
    <rect x="14" y="20" width="16" height="2" fill="#8080C0" opacity="0.7"/>
    <rect x="14" y="26" width="10" height="2" fill="#8080C0" opacity="0.5"/>
    <rect x="14" y="32" width="16" height="2" fill="#8080C0" opacity="0.7"/>
    <rect x="14" y="38" width="8"  height="2" fill="#8080C0" opacity="0.5"/>
    <!-- Glow effect -->
    <rect x="12" y="6"  width="20" height="4" fill="#A0A0FF" opacity="0.15" filter="url(#deco-glow)"/>
    <text x="22" y="76" font-family="'Courier New', monospace" font-size="7" fill="#8080C0" text-anchor="middle">ARCHIV</text>
  </g>

  <!-- Crystal cluster -->
  <g transform="translate(60, 182)" filter="url(#deco-glow)">
    <!-- Crystals pixel art -->
    <rect x="14" y="20" width="10" height="40" fill="url(#crystalGrad)"/>
    <polygon points="14,20 24,20 19,2" fill="#C0A0FF" opacity="0.9"/>
    <rect x="4"  y="30" width="8"  height="30" fill="#8060D0"/>
    <polygon points="4,30 12,30 8,14" fill="#A080E0" opacity="0.8"/>
    <rect x="26" y="32" width="8"  height="28" fill="#9070D0"/>
    <polygon points="26,32 34,32 30,18" fill="#B090E8" opacity="0.8"/>
    <!-- Shine facets -->
    <rect x="16" y="6"  width="4" height="8" fill="#E0D0FF" opacity="0.7"/>
    <rect x="6"  y="16" width="3" height="6" fill="#C0B0F0" opacity="0.6"/>
    <!-- Base -->
    <rect x="0"  y="58" width="38" height="6"  rx="2" fill="#3A2880"/>
    <text x="19" y="76" font-family="'Courier New', monospace" font-size="7" fill="#C0A0FF" text-anchor="middle">KRISTALL</text>
  </g>

  <!-- Treasure chest open -->
  <g transform="translate(122, 178)">
    <!-- Chest base -->
    <rect x="0"  y="30" width="52" height="34" fill="#7A5010"/>
    <rect x="4"  y="34" width="44" height="24" fill="#5A3808"/>
    <!-- Chest lid (open, angled) -->
    <rect x="0"  y="6"  width="52" height="26" fill="#9A6820" rx="2"/>
    <rect x="4"  y="10" width="44" height="16" fill="#7A5010" rx="1"/>
    <!-- Lid inner shine -->
    <rect x="6"  y="12" width="20" height="4"  fill="#C8922A" opacity="0.3"/>
    <!-- Gold coins spilling out -->
    <circle cx="18" cy="30" r="5"  fill="#F5D060" stroke="#C8922A" stroke-width="1"/>
    <circle cx="28" cy="28" r="5"  fill="#F5D060" stroke="#C8922A" stroke-width="1"/>
    <circle cx="38" cy="30" r="5"  fill="#F5D060" stroke="#C8922A" stroke-width="1"/>
    <circle cx="22" cy="22" r="4"  fill="#FFD700" opacity="0.7"/>
    <circle cx="34" cy="24" r="4"  fill="#FFD700" opacity="0.7"/>
    <!-- Glow from inside -->
    <rect x="6"  y="18" width="40" height="14" fill="#FFD700" opacity="0.08" filter="url(#deco-glow)"/>
    <!-- Metal clasp -->
    <rect x="21" y="28" width="10" height="8"  fill="#C8922A" rx="1"/>
    <rect x="24" y="30" width="4"  height="4"  fill="#F5D060"/>
    <!-- Metal bands -->
    <rect x="0"  y="38" width="52" height="5"  fill="#9A6820"/>
    <rect x="0"  y="52" width="52" height="5"  fill="#9A6820"/>
    <!-- Feet -->
    <rect x="4"  y="62" width="10" height="5"  fill="#5C3A10" rx="1"/>
    <rect x="38" y="62" width="10" height="5"  fill="#5C3A10" rx="1"/>
    <text x="26" y="80" font-family="'Courier New', monospace" font-size="7" fill="#F5D060" text-anchor="middle">TRUHE</text>
  </g>

  <!-- Wishing Well -->
  <g transform="translate(200, 178)">
    <rect x="0"  y="52" width="60" height="8"  rx="2" fill="#5A5850"/>
    <rect x="4"  y="36" width="52" height="20" rx="4" fill="#4A4840"/>
    <rect x="8"  y="40" width="44" height="10" rx="2" fill="#1A3A60" opacity="0.8"/>
    <!-- Water sparkle -->
    <rect x="16" y="42" width="6" height="4"  fill="#7BBFEE" opacity="0.6"/>
    <rect x="30" y="44" width="5" height="3"  fill="#A8D8FF" opacity="0.5"/>
    <rect x="42" y="42" width="6" height="4"  fill="#7BBFEE" opacity="0.6"/>
    <!-- Side pillars -->
    <rect x="0"  y="8"  width="10" height="46" fill="#5A5850"/>
    <rect x="50" y="8"  width="10" height="46" fill="#5A5850"/>
    <!-- Roof beam -->
    <rect x="-2" y="4"  width="64" height="8"  rx="2" fill="#8B6030"/>
    <rect x="0"  y="0"  width="60" height="6"  rx="1" fill="#A87040"/>
    <!-- Rope + bucket -->
    <rect x="28" y="10" width="4"  height="16" fill="#9A8060"/>
    <rect x="24" y="24" width="12" height="10" rx="2" fill="#7A5030"/>
    <rect x="22" y="22" width="16" height="4"  fill="#9A6840"/>
    <!-- Roof triangles pixel -->
    <polygon points="-2,4 30,-10 62,4" fill="#7A5030" opacity="0.8"/>
    <text x="30" y="76" font-family="'Courier New', monospace" font-size="7" fill="#7BBFEE" text-anchor="middle">BRUNNEN</text>
  </g>

  <!-- Statue / Trophy -->
  <g transform="translate(290, 172)">
    <!-- Base pedestal -->
    <rect x="0"  y="80" width="50" height="10" rx="2" fill="#5A5850"/>
    <rect x="4"  y="68" width="42" height="16" rx="2" fill="#4A4840"/>
    <!-- Column -->
    <rect x="16" y="30" width="18" height="40" fill="#6A6860"/>
    <rect x="19" y="32" width="6"  height="36" fill="#8A8880" opacity="0.4"/>
    <!-- Column details (flutes) -->
    <rect x="18" y="34" width="2"  height="32" fill="#8A8880" opacity="0.3"/>
    <rect x="22" y="34" width="2"  height="32" fill="#8A8880" opacity="0.3"/>
    <rect x="26" y="34" width="2"  height="32" fill="#8A8880" opacity="0.3"/>
    <!-- Capital -->
    <rect x="10" y="24" width="30" height="8" rx="2" fill="#7A7870"/>
    <!-- Trophy cup on top -->
    <rect x="16" y="8"  width="18" height="18" rx="3" fill="#F5D060"/>
    <rect x="18" y="10" width="14" height="12" rx="2" fill="#C8922A"/>
    <rect x="12" y="14" width="6"  height="6"  fill="#F5D060"/>
    <rect x="32" y="14" width="6"  height="6"  fill="#F5D060"/>
    <rect x="20" y="4"  width="10" height="6"  rx="2" fill="#F5D060"/>
    <!-- Star on top -->
    <polygon points="25,0 26,4 30,4 27,6 28,10 25,8 22,10 23,6 20,4 24,4"
             fill="#FFD700" filter="url(#deco-glow)"/>
    <text x="25" y="100" font-family="'Courier New', monospace" font-size="7" fill="#F5D060" text-anchor="middle">TROPHÄE</text>
  </g>
</svg>
