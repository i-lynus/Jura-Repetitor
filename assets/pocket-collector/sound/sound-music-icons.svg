<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200">
  <defs>
    <linearGradient id="sndFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241808"/><stop offset="100%" stop-color="#0D0A04"/>
    </linearGradient>
    <linearGradient id="sndGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5D060"/><stop offset="100%" stop-color="#9A6810"/>
    </linearGradient>
    <filter id="sndGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- SFX ICONS -->
  <text x="10" y="16" font-family="'Courier New', monospace" font-size="9" letter-spacing="3" fill="#C8922A" opacity="0.8">SFX ICONS</text>

  <!-- Card draw -->
  <g transform="translate(10, 24)">
    <rect x="0" y="0" width="58" height="58" rx="10" fill="url(#sndFrame)" stroke="url(#sndGold)" stroke-width="1.5"/>
    <!-- Card sliding + sound waves -->
    <rect x="14" y="20" width="20" height="28" rx="2" fill="#3A2410" stroke="#C8922A" stroke-width="1"/>
    <rect x="18" y="16" width="20" height="28" rx="2" fill="#5A3A18" stroke="#F5D060" stroke-width="1"/>
    <path d="M42,24 Q46,29 42,34" fill="none" stroke="#F5D060" stroke-width="1.5"/>
    <path d="M46,20 Q52,29 46,38" fill="none" stroke="#C8922A" stroke-width="1.5"/>
    <text x="29" y="54" font-family="'Courier New', monospace" font-size="6" fill="#C8922A" text-anchor="middle">ZIEHEN</text>
  </g>

  <!-- Scan success -->
  <g transform="translate(78, 24)">
    <rect x="0" y="0" width="58" height="58" rx="10" fill="url(#sndFrame)" stroke="#40E0A0" stroke-width="1.5"/>
    <path d="M16,28 L24,36 L42,18" fill="none" stroke="#40E0A0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#sndGlow)"/>
    <path d="M44,24 Q48,29 44,34" fill="none" stroke="#40E0A0" stroke-width="1.5"/>
    <text x="29" y="54" font-family="'Courier New', monospace" font-size="6" fill="#40E0A0" text-anchor="middle">ERFOLG</text>
  </g>

  <!-- Level up -->
  <g transform="translate(146, 24)">
    <rect x="0" y="0" width="58" height="58" rx="10" fill="url(#sndFrame)" stroke="url(#sndGold)" stroke-width="1.5"/>
    <polygon points="29,14 33,24 29,24 29,44 25,24 21,24 25,14" fill="#F5D060" filter="url(#sndGlow)"/>
    <path d="M29,46 L20,40 M29,46 L38,40" stroke="#F5D060" stroke-width="2" stroke-linecap="round"/>
    <text x="29" y="54" font-family="'Courier New', monospace" font-size="6" fill="#F5D060" text-anchor="middle">LEVEL UP</text>
  </g>

  <!-- Error -->
  <g transform="translate(214, 24)">
    <rect x="0" y="0" width="58" height="58" rx="10" fill="url(#sndFrame)" stroke="#E84040" stroke-width="1.5"/>
    <circle cx="29" cy="28" r="14" fill="none" stroke="#E84040" stroke-width="2.5"/>
    <line x1="21" y1="20" x2="37" y2="36" stroke="#E84040" stroke-width="2.5" stroke-linecap="round"/>
    <text x="29" y="54" font-family="'Courier New', monospace" font-size="6" fill="#E84040" text-anchor="middle">FEHLER</text>
  </g>

  <!-- Pack open -->
  <g transform="translate(282, 24)">
    <rect x="0" y="0" width="58" height="58" rx="10" fill="url(#sndFrame)" stroke="url(#sndGold)" stroke-width="1.5"/>
    <!-- Pack tearing with burst -->
    <rect x="18" y="24" width="22" height="24" rx="2" fill="#3A5A88" stroke="#5A8AB8" stroke-width="1"/>
    <polyline points="18,24 22,20 26,24 30,20 34,24 40,22" fill="none" stroke="#AACCEE" stroke-width="1"/>
    <polygon points="29,8 32,18 42,16 34,22 38,32 29,26 20,32 24,22 16,16 26,18" fill="#FFD700" opacity="0.8" filter="url(#sndGlow)"/>
    <text x="29" y="54" font-family="'Courier New', monospace" font-size="6" fill="#F5D060" text-anchor="middle">PACK</text>
  </g>

  <!-- Coin/reward -->
  <g transform="translate(350, 24)">
    <rect x="0" y="0" width="58" height="58" rx="10" fill="url(#sndFrame)" stroke="url(#sndGold)" stroke-width="1.5"/>
    <circle cx="24" cy="32" r="10" fill="#C8922A" stroke="#F5D060" stroke-width="1.5"/>
    <circle cx="34" cy="26" r="8"  fill="#F5D060" stroke="#FFE878" stroke-width="1"/>
    <path d="M44,18 Q48,22 44,26" fill="none" stroke="#F5D060" stroke-width="1.5"/>
    <text x="29" y="54" font-family="'Courier New', monospace" font-size="6" fill="#F5D060" text-anchor="middle">BELOHNUNG</text>
  </g>

  <!-- Mute toggle -->
  <g transform="translate(418, 24)">
    <rect x="0" y="0" width="58" height="58" rx="10" fill="url(#sndFrame)" stroke="#8A7A60" stroke-width="1.5"/>
    <polygon points="18,24 24,24 30,18 30,40 24,34 18,34" fill="#8A7A60"/>
    <line x1="36" y1="22" x2="46" y2="36" stroke="#E84040" stroke-width="2.5" stroke-linecap="round"/>
    <text x="29" y="54" font-family="'Courier New', monospace" font-size="6" fill="#8A7A60" text-anchor="middle">STUMM</text>
  </g>

  <!-- MUSIC MOODS -->
  <text x="10" y="108" font-family="'Courier New', monospace" font-size="9" letter-spacing="3" fill="#C8922A" opacity="0.8">MUSIK STIMMUNGEN</text>

  <!-- Hauptmenü -->
  <g transform="translate(10, 116)">
    <rect x="0" y="0" width="92" height="58" rx="10" fill="url(#sndFrame)" stroke="url(#sndGold)" stroke-width="1.5"/>
    <!-- Home + note -->
    <polygon points="22,30 32,20 42,30 42,42 22,42" fill="none" stroke="#F5D060" stroke-width="2"/>
    <rect x="29" y="34" width="6" height="8" fill="#C8922A"/>
    <circle cx="56" cy="38" r="4" fill="#F5D060"/>
    <rect x="59" y="20" width="2" height="18" fill="#F5D060"/>
    <rect x="59" y="20" width="8" height="3" fill="#F5D060"/>
    <text x="46" y="54" font-family="'Courier New', monospace" font-size="7" fill="#F5D060" text-anchor="middle">HAUPTMENÜ</text>
  </g>

  <!-- Garten -->
  <g transform="translate(112, 116)">
    <rect x="0" y="0" width="92" height="58" rx="10" fill="url(#sndFrame)" stroke="#6DBF4A" stroke-width="1.5"/>
    <!-- Tree + note -->
    <rect x="26" y="34" width="6" height="12" fill="#5C3A1E"/>
    <rect x="18" y="24" width="22" height="12" fill="#4A9B30"/>
    <rect x="22" y="16" width="14" height="12" fill="#6DBF4A"/>
    <circle cx="58" cy="40" r="4" fill="#6DBF4A"/>
    <rect x="61" y="22" width="2" height="18" fill="#6DBF4A"/>
    <rect x="61" y="22" width="8" height="3" fill="#6DBF4A"/>
    <text x="46" y="54" font-family="'Courier New', monospace" font-size="7" fill="#6DBF4A" text-anchor="middle">GARTEN</text>
  </g>

  <!-- Pack Opening -->
  <g transform="translate(214, 116)">
    <rect x="0" y="0" width="92" height="58" rx="10" fill="url(#sndFrame)" stroke="#FFB830" stroke-width="1.5"/>
    <polygon points="34,12 37,24 49,22 40,30 44,42 34,34 24,42 28,30 19,22 31,24" fill="#FFD700" opacity="0.85" filter="url(#sndGlow)"/>
    <circle cx="62" cy="40" r="4" fill="#FFB830"/>
    <rect x="65" y="22" width="2" height="18" fill="#FFB830"/>
    <rect x="65" y="22" width="8" height="3" fill="#FFB830"/>
    <text x="46" y="54" font-family="'Courier New', monospace" font-size="6" fill="#FFB830" text-anchor="middle">PACK OPENING</text>
  </g>

  <!-- Kampf -->
  <g transform="translate(316, 116)">
    <rect x="0" y="0" width="92" height="58" rx="10" fill="url(#sndFrame)" stroke="#E84040" stroke-width="1.5"/>
    <!-- Crossed swords -->
    <line x1="22" y1="42" x2="40" y2="18" stroke="#E0E0E0" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="42" x2="22" y2="18" stroke="#E0E0E0" stroke-width="3" stroke-linecap="round"/>
    <rect x="18" y="40" width="8" height="4" rx="1" fill="#C8922A"/>
    <rect x="36" y="40" width="8" height="4" rx="1" fill="#C8922A"/>
    <circle cx="60" cy="40" r="4" fill="#E84040"/>
    <rect x="63" y="22" width="2" height="18" fill="#E84040"/>
    <rect x="63" y="22" width="8" height="3" fill="#E84040"/>
    <text x="46" y="54" font-family="'Courier New', monospace" font-size="7" fill="#E84040" text-anchor="middle">KAMPF</text>
  </g>

  <!-- Entspannung -->
  <g transform="translate(418, 116)">
    <rect x="0" y="0" width="92" height="58" rx="10" fill="url(#sndFrame)" stroke="#A060FF" stroke-width="1.5"/>
    <!-- Moon + stars + note -->
    <path d="M30,18 Q22,22 26,32 Q34,34 36,26 Q30,26 30,18 Z" fill="#C080FF" filter="url(#sndGlow)"/>
    <circle cx="40" cy="18" r="1.5" fill="#E0B0FF"/>
    <circle cx="20" cy="38" r="1.5" fill="#E0B0FF"/>
    <circle cx="62" cy="40" r="4" fill="#A060FF"/>
    <rect x="65" y="22" width="2" height="18" fill="#A060FF"/>
    <rect x="65" y="22" width="8" height="3" fill="#A060FF"/>
    <text x="46" y="54" font-family="'Courier New', monospace" font-size="6" fill="#C080FF" text-anchor="middle">ENTSPANNUNG</text>
  </g>
</svg>
