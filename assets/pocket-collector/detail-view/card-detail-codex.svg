<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380">
  <defs>
    <linearGradient id="codexPage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8DCC0"/><stop offset="100%" stop-color="#D0C0A0"/>
    </linearGradient>
    <linearGradient id="codexCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A3808"/><stop offset="50%" stop-color="#7A5010"/><stop offset="100%" stop-color="#3A2406"/>
    </linearGradient>
    <linearGradient id="codexGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5D060"/><stop offset="100%" stop-color="#9A6810"/>
    </linearGradient>
    <linearGradient id="flameCreature" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8020"/><stop offset="100%" stop-color="#C83020"/>
    </linearGradient>
    <filter id="codexGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="paperShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#5A4830" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Open book / codex cover -->
  <rect x="6" y="10" width="548" height="360" rx="12" fill="url(#codexCover)" stroke="url(#codexGold)" stroke-width="3" filter="url(#codexGlow)"/>
  <!-- Leather tooling frame -->
  <rect x="16" y="20" width="528" height="340" rx="8" fill="none" stroke="#C8922A" stroke-width="1" opacity="0.4"/>

  <!-- Center spine -->
  <rect x="276" y="20" width="8" height="340" fill="#3A2406"/>
  <rect x="278" y="20" width="4" height="340" fill="#5A3808" opacity="0.5"/>
  <!-- Spine rings -->
  <circle cx="280" cy="70"  r="5" fill="none" stroke="#C8922A" stroke-width="1.5"/>
  <circle cx="280" cy="150" r="5" fill="none" stroke="#C8922A" stroke-width="1.5"/>
  <circle cx="280" cy="230" r="5" fill="none" stroke="#C8922A" stroke-width="1.5"/>
  <circle cx="280" cy="310" r="5" fill="none" stroke="#C8922A" stroke-width="1.5"/>

  <!-- LEFT PAGE: Creature art -->
  <rect x="26" y="30" width="240" height="320" rx="4" fill="url(#codexPage)" filter="url(#paperShadow)"/>
  <!-- Page aging spots -->
  <circle cx="50"  cy="320" r="14" fill="#C0A878" opacity="0.2"/>
  <circle cx="240" cy="50"  r="10" fill="#C0A878" opacity="0.2"/>

  <!-- Entry number + name -->
  <text x="44" y="58" font-family="'Courier New', monospace" font-size="18" font-weight="900" fill="#5A3808">#006</text>
  <text x="44" y="78" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#7A5010">FLAMMARION</text>
  <line x1="44" y1="86" x2="248" y2="86" stroke="#9A8050" stroke-width="1" opacity="0.5"/>

  <!-- Creature illustration frame -->
  <rect x="56" y="98" width="180" height="180" rx="6" fill="#E0D0B0" stroke="#9A8050" stroke-width="1.5"/>
  <!-- Generic flame dragon (pixel art, original) -->
  <g transform="translate(80, 120)">
    <!-- Wings -->
    <polygon points="0,40 -16,20 -10,60 8,60" fill="#9A2818" opacity="0.85"/>
    <polygon points="130,40 146,20 140,60 122,60" fill="#9A2818" opacity="0.85"/>
    <!-- Body -->
    <rect x="40" y="30" width="50" height="50" rx="8" fill="url(#flameCreature)"/>
    <rect x="46" y="78" width="14" height="40" fill="#C83020"/>
    <rect x="70" y="78" width="14" height="40" fill="#C83020"/>
    <!-- Belly -->
    <rect x="52" y="44" width="26" height="32" rx="6" fill="#F5C060" opacity="0.7"/>
    <!-- Head -->
    <rect x="44" y="4" width="42" height="34" rx="10" fill="url(#flameCreature)"/>
    <!-- Snout -->
    <rect x="78" y="14" width="16" height="14" rx="4" fill="#E84040"/>
    <!-- Eyes -->
    <rect x="52" y="14" width="8" height="8" fill="#FFD700"/>
    <rect x="54" y="16" width="3" height="4" fill="#1A1A1A"/>
    <rect x="70" y="14" width="8" height="8" fill="#FFD700"/>
    <rect x="72" y="16" width="3" height="4" fill="#1A1A1A"/>
    <!-- Horns -->
    <rect x="48" y="-4" width="6" height="10" fill="#E0C090"/>
    <rect x="76" y="-4" width="6" height="10" fill="#E0C090"/>
    <!-- Tail with flame -->
    <rect x="84" y="100" width="24" height="10" rx="4" fill="#C83020"/>
    <rect x="104" y="90" width="14" height="14" rx="6" fill="#FF8020" filter="url(#codexGlow)"/>
    <polygon points="111,76 117,92 105,92" fill="#FFD700" filter="url(#codexGlow)"/>
    <polygon points="111,82 114,90 108,90" fill="#FFFDE0"/>
    <!-- Claws -->
    <rect x="46" y="116" width="14" height="4" fill="#E0C090"/>
    <rect x="70" y="116" width="14" height="4" fill="#E0C090"/>
  </g>

  <!-- Audio/cry button -->
  <rect x="56" y="288" width="180" height="28" rx="6" fill="#7A5010" stroke="url(#codexGold)" stroke-width="1.5"/>
  <polygon points="74,296 74,308 82,302" fill="#F5D060"/>
  <path d="M86,298 Q92,302 86,306" fill="none" stroke="#F5D060" stroke-width="1.5"/>
  <path d="M90,295 Q100,302 90,309" fill="none" stroke="#F5D060" stroke-width="1.5"/>
  <text x="160" y="306" font-family="'Courier New', monospace" font-size="9" fill="#F5D060" text-anchor="middle">RUF ABSPIELEN</text>
  <!-- Nav arrows -->
  <text x="44" y="338" font-family="'Courier New', monospace" font-size="14" fill="#7A5010">◄ #005</text>
  <text x="248" y="338" font-family="'Courier New', monospace" font-size="14" fill="#7A5010" text-anchor="end">#007 ►</text>

  <!-- RIGHT PAGE: Stats & info -->
  <rect x="294" y="30" width="240" height="320" rx="4" fill="url(#codexPage)" filter="url(#paperShadow)"/>
  <circle cx="320" cy="320" r="12" fill="#C0A878" opacity="0.2"/>

  <!-- Info rows -->
  <g font-family="'Courier New', monospace">
    <text x="310" y="58" font-size="10" font-weight="700" fill="#5A3808">KATEGORIE</text>
    <text x="430" y="58" font-size="10" fill="#7A5010">Flammen-Wesen</text>
    <line x1="310" y1="64" x2="518" y2="64" stroke="#9A8050" stroke-width="0.5" opacity="0.4"/>

    <text x="310" y="84" font-size="10" font-weight="700" fill="#5A3808">TYP</text>
    <!-- Fire type badge -->
    <circle cx="430" cy="80" r="8" fill="#C83020" stroke="#E87020" stroke-width="1"/>
    <polygon points="430,75 433,81 427,81" fill="#FF8020"/>
    <text x="446" y="84" font-size="10" fill="#7A5010">Feuer</text>
    <line x1="310" y1="92" x2="518" y2="92" stroke="#9A8050" stroke-width="0.5" opacity="0.4"/>

    <text x="310" y="112" font-size="10" font-weight="700" fill="#5A3808">GRÖSSE</text>
    <text x="430" y="112" font-size="10" fill="#7A5010">1,7 m</text>
    <line x1="310" y1="118" x2="518" y2="118" stroke="#9A8050" stroke-width="0.5" opacity="0.4"/>

    <text x="310" y="138" font-size="10" font-weight="700" fill="#5A3808">GEWICHT</text>
    <text x="430" y="138" font-size="10" fill="#7A5010">90,5 kg</text>
    <line x1="310" y1="144" x2="518" y2="144" stroke="#9A8050" stroke-width="0.5" opacity="0.4"/>

    <text x="310" y="164" font-size="10" font-weight="700" fill="#5A3808">FÄHIGKEIT</text>
    <text x="430" y="164" font-size="10" fill="#7A5010">Großbrand</text>
  </g>

  <!-- Stat bars -->
  <g transform="translate(310, 184)">
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="9" font-weight="700" fill="#5A3808">BASISWERTE</text>
    <!-- ATK -->
    <text x="0" y="20" font-family="'Courier New', monospace" font-size="8" fill="#7A5010">ANG</text>
    <rect x="40" y="12" width="160" height="9" rx="3" fill="#C0B090"/>
    <rect x="40" y="12" width="130" height="9" rx="3" fill="#C83020"/>
    <!-- DEF -->
    <text x="0" y="36" font-family="'Courier New', monospace" font-size="8" fill="#7A5010">VER</text>
    <rect x="40" y="28" width="160" height="9" rx="3" fill="#C0B090"/>
    <rect x="40" y="28" width="92" height="9" rx="3" fill="#4A9B30"/>
    <!-- SPD -->
    <text x="0" y="52" font-family="'Courier New', monospace" font-size="8" fill="#7A5010">SPE</text>
    <rect x="40" y="44" width="160" height="9" rx="3" fill="#C0B090"/>
    <rect x="40" y="44" width="148" height="9" rx="3" fill="#3A8ABF"/>
    <!-- HP -->
    <text x="0" y="68" font-family="'Courier New', monospace" font-size="8" fill="#7A5010">KP</text>
    <rect x="40" y="60" width="160" height="9" rx="3" fill="#C0B090"/>
    <rect x="40" y="60" width="110" height="9" rx="3" fill="#C8922A"/>
  </g>

  <!-- Description box -->
  <rect x="310" y="266" width="208" height="56" rx="4" fill="#E0D0B0" stroke="#9A8050" stroke-width="1"/>
  <text x="318" y="282" font-family="'Courier New', monospace" font-size="8" fill="#5A3808">Speit Feuer, das heiß genug ist,</text>
  <text x="318" y="294" font-family="'Courier New', monospace" font-size="8" fill="#5A3808">um Felsen zu schmelzen. Seine</text>
  <text x="318" y="306" font-family="'Courier New', monospace" font-size="8" fill="#5A3808">Flügel tragen es in große Höhen.</text>

  <!-- Owned / collected indicator -->
  <rect x="310" y="330" width="100" height="18" rx="4" fill="#2D6B1A" opacity="0.85"/>
  <text x="360" y="343" font-family="'Courier New', monospace" font-size="8" font-weight="700" fill="#A8E060" text-anchor="middle">✓ GESAMMELT ×3</text>
  <!-- Rarity stars -->
  <polygon points="430,338 432,343 438,343 433,346 435,352 430,348 425,352 427,346 422,343 428,343" fill="#C8922A"/>
  <polygon points="448,338 450,343 456,343 451,346 453,352 448,348 443,352 445,346 440,343 446,343" fill="#C8922A"/>
  <polygon points="466,338 468,343 474,343 469,346 471,352 466,348 461,352 463,346 458,343 464,343" fill="#C8922A"/>
</svg>
