<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="activeGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5D060"/>
      <stop offset="100%" style="stop-color:#C8922A"/>
    </linearGradient>
    <linearGradient id="inactiveGray" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8A7A60"/>
      <stop offset="100%" style="stop-color:#5A4A30"/>
    </linearGradient>
    <filter id="iconGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- COLLECTION icon (active - gold) -->
  <g transform="translate(10, 10)">
    <rect x="20" y="15" width="40" height="56" rx="4" fill="none" stroke="url(#activeGold)" stroke-width="2.5" filter="url(#iconGlow)"/>
    <!-- Cards stacked behind -->
    <rect x="26" y="10" width="40" height="56" rx="4" fill="none" stroke="#C8922A" stroke-width="1.5" opacity="0.5"/>
    <rect x="32" y="5"  width="40" height="56" rx="4" fill="none" stroke="#9A6810" stroke-width="1" opacity="0.3"/>
    <!-- Lines on card -->
    <line x1="28" y1="32" x2="52" y2="32" stroke="#F5D060" stroke-width="1.5" opacity="0.8"/>
    <line x1="28" y1="40" x2="52" y2="40" stroke="#C8922A" stroke-width="1" opacity="0.6"/>
    <line x1="28" y1="48" x2="46" y2="48" stroke="#C8922A" stroke-width="1" opacity="0.6"/>
    <!-- Star rarity top-right -->
    <polygon points="50,20 52,26 58,26 53,30 55,36 50,32 45,36 47,30 42,26 48,26" fill="#F5D060" opacity="0.9"/>
    <text x="30" y="92" font-family="'Courier New', monospace" font-size="9" letter-spacing="1" fill="#F5D060" font-weight="700">COLLECTION</text>
  </g>

  <!-- BINDER icon (inactive) -->
  <g transform="translate(100, 10)">
    <!-- Binder rings -->
    <rect x="22" y="10" width="8"  height="60" rx="4" fill="url(#inactiveGray)" stroke="#6A5A40" stroke-width="1"/>
    <!-- Binder pages -->
    <rect x="28" y="14" width="42" height="52" rx="2" fill="none" stroke="url(#inactiveGray)" stroke-width="2"/>
    <!-- Ring holes -->
    <circle cx="26" cy="28" r="4" fill="none" stroke="#8A7A60" stroke-width="1.5"/>
    <circle cx="26" cy="43" r="4" fill="none" stroke="#8A7A60" stroke-width="1.5"/>
    <circle cx="26" cy="58" r="4" fill="none" stroke="#8A7A60" stroke-width="1.5"/>
    <!-- Page lines -->
    <line x1="34" y1="26" x2="64" y2="26" stroke="#6A5A40" stroke-width="1" opacity="0.8"/>
    <line x1="34" y1="34" x2="64" y2="34" stroke="#6A5A40" stroke-width="1" opacity="0.8"/>
    <line x1="34" y1="42" x2="64" y2="42" stroke="#6A5A40" stroke-width="1" opacity="0.8"/>
    <line x1="34" y1="50" x2="56" y2="50" stroke="#6A5A40" stroke-width="1" opacity="0.8"/>
    <text x="26" y="92" font-family="'Courier New', monospace" font-size="9" letter-spacing="2" fill="#8A7A60">BINDER</text>
  </g>

  <!-- SCAN LENS icon (inactive) -->
  <g transform="translate(200, 10)">
    <!-- Magnifying glass outer -->
    <circle cx="38" cy="34" r="22" fill="none" stroke="url(#inactiveGray)" stroke-width="2.5"/>
    <!-- Lens glass tint -->
    <circle cx="38" cy="34" r="19" fill="#0A1A1A" opacity="0.4"/>
    <!-- Scan lines -->
    <line x1="20" y1="34" x2="56" y2="34" stroke="#5A8A80" stroke-width="1" opacity="0.6"/>
    <line x1="38" y1="16" x2="38" y2="52" stroke="#5A8A80" stroke-width="1" opacity="0.6"/>
    <!-- Corner scan brackets -->
    <path d="M24,22 L24,28 L30,28" fill="none" stroke="#7ABFB0" stroke-width="2" stroke-linecap="round"/>
    <path d="M52,22 L52,28 L46,28" fill="none" stroke="#7ABFB0" stroke-width="2" stroke-linecap="round"/>
    <path d="M24,46 L24,40 L30,40" fill="none" stroke="#7ABFB0" stroke-width="2" stroke-linecap="round"/>
    <path d="M52,46 L52,40 L46,40" fill="none" stroke="#7ABFB0" stroke-width="2" stroke-linecap="round"/>
    <!-- Handle -->
    <line x1="55" y1="52" x2="68" y2="65" stroke="url(#inactiveGray)" stroke-width="4" stroke-linecap="round"/>
    <text x="14" y="92" font-family="'Courier New', monospace" font-size="9" letter-spacing="1" fill="#8A7A60">SCAN LENS</text>
  </g>

  <!-- GARDEN icon (active/featured) -->
  <g transform="translate(300, 10)">
    <!-- Ground -->
    <rect x="14" y="54" width="56" height="14" rx="2" fill="none" stroke="url(#activeGold)" stroke-width="2" filter="url(#iconGlow)"/>
    <!-- Tree trunk -->
    <rect x="38" y="32" width="8" height="24" fill="url(#activeGold)"/>
    <!-- Tree foliage (pixel layers) -->
    <rect x="22" y="22" width="40" height="14" fill="#5DB840"/>
    <rect x="28" y="12" width="28" height="14" fill="#6DBF4A"/>
    <rect x="34" y="4"  width="16" height="12" fill="#A8E060"/>
    <!-- Small flowers -->
    <circle cx="20" cy="58" r="4" fill="#FF9B40"/>
    <circle cx="64" cy="56" r="4" fill="#E84080"/>
    <!-- Shine on foliage -->
    <rect x="28" y="14" width="8" height="4" fill="#A8E060" opacity="0.4"/>
    <text x="22" y="92" font-family="'Courier New', monospace" font-size="9" letter-spacing="1" fill="#F5D060" font-weight="700" filter="url(#iconGlow)">GARDEN</text>
  </g>
</svg>
