<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <!-- Scan lens animation: sweep line moves top-to-bottom, corner brackets tighten, result flashes -->

  <defs>
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#40E0A0" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#40E0A0" stop-opacity="0.8"/>
      <stop offset="50%"  stop-color="#40E0A0" stop-opacity="1"/>
      <stop offset="60%"  stop-color="#40E0A0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#40E0A0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scanBgAnim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1A14"/><stop offset="100%" stop-color="#050D0A"/>
    </linearGradient>
    <filter id="sweepGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Scanner frame -->
  <rect x="4" y="4" width="192" height="252" rx="12" fill="url(#scanBgAnim)" stroke="#20604A" stroke-width="2"/>

  <!-- CRT scanlines (static) -->
  <rect x="4" y="4"   width="192" height="1" fill="#40E0A0" opacity="0.04"/>
  <rect x="4" y="12"  width="192" height="1" fill="#40E0A0" opacity="0.04"/>
  <rect x="4" y="20"  width="192" height="1" fill="#40E0A0" opacity="0.04"/>
  <rect x="4" y="28"  width="192" height="1" fill="#40E0A0" opacity="0.04"/>
  <rect x="4" y="36"  width="192" height="1" fill="#40E0A0" opacity="0.04"/>
  <rect x="4" y="44"  width="192" height="1" fill="#40E0A0" opacity="0.04"/>
  <rect x="4" y="52"  width="192" height="1" fill="#40E0A0" opacity="0.04"/>
  <rect x="4" y="60"  width="192" height="1" fill="#40E0A0" opacity="0.04"/>
  <rect x="4" y="68"  width="192" height="1" fill="#40E0A0" opacity="0.04"/>
  <rect x="4" y="76"  width="192" height="1" fill="#40E0A0" opacity="0.04"/>
  <rect x="4" y="84"  width="192" height="1" fill="#40E0A0" opacity="0.04"/>
  <rect x="4" y="92"  width="192" height="1" fill="#40E0A0" opacity="0.04"/>
  <rect x="4" y="100" width="192" height="1" fill="#40E0A0" opacity="0.04"/>

  <!-- Card placeholder (target being scanned) -->
  <rect x="44" y="50" width="112" height="156" rx="6" fill="#0A1810" stroke="#20604A" stroke-width="1.5"/>
  <!-- Card art placeholder lines -->
  <rect x="52" y="60"  width="96" height="80" rx="3" fill="#060E08"/>
  <rect x="52" y="148" width="96" height="12" rx="2" fill="#081208" stroke="#106030" stroke-width="0.5"/>
  <rect x="52" y="164" width="96" height="34" rx="2" fill="#060E08"/>

  <!-- Corner scan brackets (animate to tighten) -->
  <!-- TL -->
  <path d="M30,30 L30,60 L60,60" fill="none" stroke="#40E0A0" stroke-width="2.5" stroke-linecap="square" filter="url(#sweepGlow)">
    <animate attributeName="d"
             values="M30,30 L30,60 L60,60; M38,42 L38,58 L54,58; M42,46 L42,56 L52,56; M44,48 L44,54 L50,54; M42,46 L42,56 L52,56; M38,42 L38,58 L54,58; M30,30 L30,60 L60,60; M30,30 L30,60 L60,60"
             dur="3.2s" repeatCount="indefinite"/>
  </path>
  <!-- TR -->
  <path d="M170,30 L170,60 L140,60" fill="none" stroke="#40E0A0" stroke-width="2.5" stroke-linecap="square" filter="url(#sweepGlow)">
    <animate attributeName="d"
             values="M170,30 L170,60 L140,60; M162,42 L162,58 L146,58; M158,46 L158,56 L148,56; M156,48 L156,54 L150,54; M158,46 L158,56 L148,56; M162,42 L162,58 L146,58; M170,30 L170,60 L140,60; M170,30 L170,60 L140,60"
             dur="3.2s" repeatCount="indefinite"/>
  </path>
  <!-- BL -->
  <path d="M30,230 L30,200 L60,200" fill="none" stroke="#40E0A0" stroke-width="2.5" stroke-linecap="square" filter="url(#sweepGlow)">
    <animate attributeName="d"
             values="M30,230 L30,200 L60,200; M38,218 L38,202 L54,202; M42,214 L42,204 L52,204; M44,212 L44,206 L50,206; M42,214 L42,204 L52,204; M38,218 L38,202 L54,202; M30,230 L30,200 L60,200; M30,230 L30,200 L60,200"
             dur="3.2s" repeatCount="indefinite"/>
  </path>
  <!-- BR -->
  <path d="M170,230 L170,200 L140,200" fill="none" stroke="#40E0A0" stroke-width="2.5" stroke-linecap="square" filter="url(#sweepGlow)">
    <animate attributeName="d"
             values="M170,230 L170,200 L140,200; M162,218 L162,202 L146,202; M158,214 L158,204 L148,204; M156,212 L156,206 L150,206; M158,214 L158,204 L148,204; M162,218 L162,202 L146,202; M170,230 L170,200 L140,200; M170,230 L170,200 L140,200"
             dur="3.2s" repeatCount="indefinite"/>
  </path>

  <!-- SCAN SWEEP LINE (moves top to bottom) -->
  <rect x="4" y="0" width="192" height="18" fill="url(#sweepGrad)" opacity="0.9" filter="url(#sweepGlow)">
    <animate attributeName="y" values="-18;20;50;80;110;140;170;200;230;260;-18"
             dur="3.2s" repeatCount="indefinite" calcMode="linear"/>
  </rect>

  <!-- Cross-hair lines (pulse) -->
  <line x1="10"  y1="130" x2="190" y2="130" stroke="#40E0A0" stroke-width="0.8" opacity="0">
    <animate attributeName="opacity" values="0;0.2;0.4;0.3;0.4;0.2;0.1;0;0" dur="3.2s" repeatCount="indefinite"/>
  </line>
  <line x1="100" y1="10"  x2="100" y2="250" stroke="#40E0A0" stroke-width="0.8" opacity="0">
    <animate attributeName="opacity" values="0;0.2;0.4;0.3;0.4;0.2;0.1;0;0" dur="3.2s" repeatCount="indefinite"/>
  </line>

  <!-- RESULT FLASH: "92%" trust score appears -->
  <rect x="60" y="90" width="80" height="40" rx="6" fill="#0A1810" stroke="#40E0A0" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" values="0;0;0;0;0;0;0.95;0.8;0" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <text x="100" y="118" font-family="'Courier New', monospace" font-size="22" font-weight="900"
        fill="#40E0A0" text-anchor="middle" opacity="0" filter="url(#sweepGlow)">
    <animate attributeName="opacity" values="0;0;0;0;0;0;1;0.7;0" dur="3.2s" repeatCount="indefinite"/>
    92%
  </text>

  <!-- Status indicator dot (top left of frame) -->
  <circle cx="20" cy="20" r="5" fill="#40E040" filter="url(#sweepGlow)">
    <animate attributeName="opacity" values="1;0.4;1;0.4;1;0.4;1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <!-- SCANNING label -->
  <text x="100" y="24" font-family="'Courier New', monospace" font-size="9" font-weight="700"
        letter-spacing="2" fill="#40E0A0" text-anchor="middle" filter="url(#sweepGlow)">SCANNING...</text>
  <!-- Status changes to COMPLETE -->
  <text x="100" y="242" font-family="'Courier New', monospace" font-size="9" font-weight="700"
        letter-spacing="2" fill="#40E0A0" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" values="0;0;0;0;0;0;0.8;0.5;0" dur="3.2s" repeatCount="indefinite"/>
    COMPLETE ✓
  </text>
</svg>
