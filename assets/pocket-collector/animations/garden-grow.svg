<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <!-- Garden plant growing animation: seed → sprout → sapling → full tree (8 frames) -->
  <!-- Frame timing: each phase ~0.5s, total 4s loop -->

  <defs>
    <linearGradient id="growGround" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A4A18"/><stop offset="100%" stop-color="#162A0C"/>
    </linearGradient>
    <filter id="bloomGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sparkleGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Ground -->
  <rect x="0" y="110" width="120" height="30" fill="url(#growGround)"/>
  <!-- Ground highlight -->
  <line x1="0" y1="112" x2="120" y2="112" stroke="#3A6B20" stroke-width="1.5" opacity="0.5"/>

  <!-- SEED phase (frame 1-2) -->
  <g opacity="1">
    <animate attributeName="opacity" values="1;0.8;0;0;0;0;0;0;1" dur="4s" repeatCount="indefinite"/>
    <rect x="54" y="104" width="12" height="8" rx="4" fill="#7A5010"/>
    <rect x="56" y="106" width="4"  height="4" rx="2" fill="#9A7030" opacity="0.6"/>
    <!-- Seed glow -->
    <circle cx="60" cy="108" r="8" fill="#C8922A" opacity="0.08" filter="url(#bloomGlow)"/>
  </g>

  <!-- SPROUT phase (frame 2-3) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.9;1;0;0;0;0;0;0" dur="4s" repeatCount="indefinite"/>
    <!-- First shoot -->
    <rect x="58" y="88" width="4" height="18" fill="#4A9B30"/>
    <rect x="44" y="88" width="16" height="6" fill="#5DB840" rx="3"/>
    <rect x="60" y="84" width="16" height="6" fill="#4A9B30" rx="3"/>
    <!-- Seed remains -->
    <rect x="54" y="104" width="12" height="8" rx="4" fill="#7A5010"/>
    <!-- Magic sparkles -->
    <circle cx="44" cy="86" r="2.5" fill="#A8E060" opacity="0.9" filter="url(#sparkleGlow)"/>
    <circle cx="78" cy="82" r="2"   fill="#6DBF4A" opacity="0.8" filter="url(#sparkleGlow)"/>
  </g>

  <!-- SAPLING phase (frame 3-4-5) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0.9;1;0.9;0;0;0;0" dur="4s" repeatCount="indefinite"/>
    <!-- Trunk thin -->
    <rect x="57" y="70" width="6" height="36" fill="#5C3A1E"/>
    <!-- Small foliage top (2 layers) -->
    <rect x="38" y="60" width="44" height="16" fill="#4A9B30"/>
    <rect x="44" y="48" width="32" height="16" fill="#5DB840"/>
    <rect x="50" y="38" width="20" height="14" fill="#6DBF4A"/>
    <!-- Small shine -->
    <rect x="46" y="50" width="8" height="4" fill="#A8E060" opacity="0.4"/>
    <!-- Sparkle burst from growth -->
    <circle cx="34" cy="62" r="3"  fill="#A8E060" filter="url(#sparkleGlow)" opacity="0.8"/>
    <circle cx="86" cy="58" r="2.5" fill="#6DBF4A" filter="url(#sparkleGlow)" opacity="0.8"/>
    <circle cx="60" cy="30" r="3"  fill="#FFD700" filter="url(#sparkleGlow)" opacity="0.7"/>
  </g>

  <!-- FULL TREE phase (frame 5-6-7-8) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;0;0;1;1;1;0" dur="4s" repeatCount="indefinite"/>
    <!-- Trunk -->
    <rect x="55" y="70" width="10" height="38" fill="#5C3A1E"/>
    <rect x="58" y="70" width="4"  height="38" fill="#7A5030" opacity="0.5"/>
    <!-- Root exposed -->
    <rect x="44" y="100" width="14" height="6" fill="#5C3A1E"/>
    <rect x="62" y="100" width="14" height="6" fill="#5C3A1E"/>
    <!-- Foliage 3 layers -->
    <rect x="24" y="62" width="72" height="18" fill="#2D6B1A"/>
    <rect x="30" y="46" width="60" height="20" fill="#4A9B30"/>
    <rect x="38" y="32" width="44" height="18" fill="#5DB840"/>
    <rect x="44" y="18" width="32" height="18" fill="#6DBF4A"/>
    <rect x="50" y="8"  width="20" height="14" fill="#A8E060"/>
    <!-- Highlights -->
    <rect x="32" y="48" width="14" height="6" fill="#6DBF4A" opacity="0.4"/>
    <rect x="40" y="34" width="10" height="4" fill="#A8E060" opacity="0.4"/>
    <!-- Small red fruits -->
    <circle cx="28" cy="74" r="4"  fill="#E84040" opacity="0.9"/>
    <circle cx="90" cy="70" r="4"  fill="#E84040" opacity="0.9"/>
    <circle cx="60" cy="56" r="3.5" fill="#FFB830" opacity="0.9"/>
    <!-- Bloom sparkles on full grown -->
    <circle cx="20"  cy="62" r="3"  fill="#FFD700" filter="url(#sparkleGlow)" opacity="0.6"/>
    <circle cx="100" cy="58" r="2.5" fill="#FFD700" filter="url(#sparkleGlow)" opacity="0.6"/>
    <circle cx="60"  cy="4"  r="3"  fill="#A8E060" filter="url(#sparkleGlow)" opacity="0.7"/>
    <circle cx="30"  cy="40" r="2"  fill="#FF9B40" filter="url(#sparkleGlow)" opacity="0.6"/>
    <circle cx="90"  cy="36" r="2"  fill="#FF9B40" filter="url(#sparkleGlow)" opacity="0.6"/>
  </g>

  <!-- IDLE SWAY on full tree (leaves gently moving) - subtle offset animation -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;0;0;0;0;1;0" dur="4s" repeatCount="indefinite"/>
    <!-- Same tree but with slight translateX sway -->
    <rect x="55" y="70" width="10" height="38" fill="#5C3A1E"/>
    <rect x="44" y="100" width="14" height="6" fill="#5C3A1E"/>
    <rect x="62" y="100" width="14" height="6" fill="#5C3A1E"/>
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0,0; 2,-1; 4,-2; 2,-1; 0,0" dur="2s" repeatCount="indefinite"/>
      <rect x="24" y="62" width="72" height="18" fill="#2D6B1A"/>
      <rect x="30" y="46" width="60" height="20" fill="#4A9B30"/>
      <rect x="38" y="32" width="44" height="18" fill="#5DB840"/>
      <rect x="44" y="18" width="32" height="18" fill="#6DBF4A"/>
      <rect x="50" y="8"  width="20" height="14" fill="#A8E060"/>
      <circle cx="28" cy="74" r="4"  fill="#E84040" opacity="0.9"/>
      <circle cx="90" cy="70" r="4"  fill="#E84040" opacity="0.9"/>
      <circle cx="60" cy="56" r="3.5" fill="#FFB830" opacity="0.9"/>
    </g>
  </g>

  <!-- Floating particle always present -->
  <circle cx="30" cy="90" r="2" fill="#A8E060" opacity="0">
    <animate attributeName="cy"      values="90;82;74;66;58;50" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cx"      values="30;28;32;29;31;28" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0.7;0.5;0.3;0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="88" r="1.5" fill="#FFD700" opacity="0">
    <animate attributeName="cy"      values="88;80;72;64;56;48" dur="4s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="cx"      values="90;92;89;92;90;92" dur="4s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.4;0.6;0.4;0.2;0" dur="4s" begin="1s" repeatCount="indefinite"/>
  </circle>
</svg>
