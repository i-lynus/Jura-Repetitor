<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" width="400" height="80">
  <defs>
    <linearGradient id="navBarBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1208"/><stop offset="100%" stop-color="#0A0804"/>
    </linearGradient>
    <linearGradient id="navActiveGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5D060"/><stop offset="100%" stop-color="#C8922A"/>
    </linearGradient>
    <radialGradient id="navActiveGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5D060" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F5D060" stop-opacity="0"/>
    </radialGradient>
    <filter id="navGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Bar background -->
  <rect x="0" y="6" width="400" height="74" rx="16" fill="url(#navBarBg)" stroke="#3A2808" stroke-width="1.5"/>
  <!-- Top gold accent line -->
  <rect x="16" y="6" width="368" height="2" rx="1" fill="#C8922A" opacity="0.4"/>

  <!-- ===== TAB 1: COLLECTION ===== -->
  <g transform="translate(8, 14)">
    <rect x="0" y="0" width="72" height="60" rx="10" fill="#241808" stroke="#C8922A" stroke-width="1.5"/>
    <ellipse cx="36" cy="26" rx="30" ry="20" fill="url(#navActiveGlow)"/>
    <!-- Cards stacked -->
    <rect x="24" y="12" width="22" height="30" rx="3" fill="none" stroke="url(#navActiveGold)" stroke-width="2" filter="url(#navGlow)"/>
    <rect x="28" y="9"  width="22" height="30" rx="3" fill="none" stroke="#C8922A" stroke-width="1.2" opacity="0.5"/>
    <polygon points="42,15 44,19 48,19 45,22 46,26 42,24 38,26 39,22 36,19 40,19" fill="#F5D060"/>
    <text x="36" y="54" font-family="'Courier New', monospace" font-size="7" font-weight="700" fill="#F5D060" text-anchor="middle">SAMMLUNG</text>
    <!-- Active indicator -->
    <rect x="26" y="57" width="20" height="2.5" rx="1.5" fill="#F5D060"/>
  </g>

  <!-- ===== TAB 2: BINDER ===== -->
  <g transform="translate(88, 18)">
    <rect x="18" y="8"  width="7"  height="38" rx="3" fill="#5A4A30"/>
    <rect x="24" y="11" width="28" height="32" rx="2" fill="none" stroke="#8A7A60" stroke-width="2"/>
    <circle cx="22" cy="18" r="3" fill="none" stroke="#8A7A60" stroke-width="1.3"/>
    <circle cx="22" cy="27" r="3" fill="none" stroke="#8A7A60" stroke-width="1.3"/>
    <circle cx="22" cy="36" r="3" fill="none" stroke="#8A7A60" stroke-width="1.3"/>
    <rect x="29" y="17" width="18" height="2.5" fill="#6A5A40"/>
    <rect x="29" y="24" width="18" height="2.5" fill="#6A5A40"/>
    <rect x="29" y="31" width="14" height="2.5" fill="#6A5A40"/>
    <text x="36" y="58" font-family="'Courier New', monospace" font-size="7" fill="#8A7A60" text-anchor="middle">BINDER</text>
  </g>

  <!-- ===== TAB 3: SCAN LENS ===== -->
  <g transform="translate(164, 18)">
    <circle cx="34" cy="26" r="17" fill="none" stroke="#8A7A60" stroke-width="2"/>
    <circle cx="34" cy="26" r="14" fill="#0A1A1A" opacity="0.4"/>
    <path d="M24,18 L24,22 L28,22" fill="none" stroke="#7A6A50" stroke-width="1.5"/>
    <path d="M44,18 L44,22 L40,22" fill="none" stroke="#7A6A50" stroke-width="1.5"/>
    <path d="M24,34 L24,30 L28,30" fill="none" stroke="#7A6A50" stroke-width="1.5"/>
    <path d="M44,34 L44,30 L40,30" fill="none" stroke="#7A6A50" stroke-width="1.5"/>
    <line x1="44" y1="38" x2="52" y2="46" stroke="#8A7A60" stroke-width="3.5" stroke-linecap="round"/>
    <text x="36" y="58" font-family="'Courier New', monospace" font-size="7" fill="#8A7A60" text-anchor="middle">SCAN</text>
  </g>

  <!-- ===== TAB 4: GARDEN ===== -->
  <g transform="translate(240, 18)">
    <rect x="14" y="40" width="44" height="8" rx="2" fill="none" stroke="#7A6A50" stroke-width="1.5"/>
    <rect x="33" y="24" width="6"  height="18" fill="#7A6A50"/>
    <rect x="20" y="18" width="32" height="10" fill="#5A7B40"/>
    <rect x="26" y="10" width="20" height="10" fill="#6A8B50"/>
    <rect x="30" y="4"  width="12" height="8"  fill="#7A9B60"/>
    <circle cx="18" cy="44" r="3" fill="#8A6A40" opacity="0.7"/>
    <circle cx="54" cy="42" r="3" fill="#8A6A40" opacity="0.7"/>
    <text x="36" y="58" font-family="'Courier New', monospace" font-size="7" fill="#8A7A60" text-anchor="middle">GARTEN</text>
  </g>

  <!-- ===== TAB 5: ARCHIVE ===== -->
  <g transform="translate(316, 18)">
    <!-- Obelisk / archive stone -->
    <rect x="26" y="14" width="22" height="30" fill="none" stroke="#8A7A60" stroke-width="2"/>
    <polygon points="26,14 48,14 37,6" fill="none" stroke="#8A7A60" stroke-width="2"/>
    <rect x="30" y="20" width="14" height="2" fill="#6A5A40"/>
    <rect x="30" y="26" width="14" height="2" fill="#6A5A40"/>
    <rect x="30" y="32" width="10" height="2" fill="#6A5A40"/>
    <text x="37" y="58" font-family="'Courier New', monospace" font-size="7" fill="#8A7A60" text-anchor="middle">ARCHIV</text>
  </g>
</svg>
